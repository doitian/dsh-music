name: publish

# Publishes with npm trusted publishing (OIDC). There is deliberately no
# NODE_AUTH_TOKEN and no NPM_TOKEN secret anywhere in this workflow: adding one
# would disable the OIDC exchange and make the publish fail.
#
# The trust is attached. Inspect it with `npm trust list @doitian/dsh-music`:
#
#   id d2137897-6505-4ec1-bfcc-d82638e56b90, type github, file publish.yml,
#   repository doitian/dsh-music, permissions createPackage + createStagedPackage
#
# Re-attaching is a one-time setup, by the package owner (npm 11.15 or later).
# It needs the package to exist already — `npm trust` refuses a name that does
# not, so a brand-new package takes one hand publish first:
#
#   npm login
#   npm trust github @doitian/dsh-music \
#     --file publish.yml \
#     --repo doitian/dsh-music \
#     --allow-publish
#
# --allow-publish is required, and --dry-run shows what it would create. Omit
# --environment, matching this job, which declares no `environment:`; a
# configured environment must match exactly or the OIDC exchange is rejected.
# The registry keeps one trust config per package: revoke with
# `npm trust revoke --id <id> @doitian/dsh-music` before creating a different one.
#
# Releasing: bump `version` in package.json, run `npm run changelog`, commit,
# then create a GitHub release whose tag is `v<version>` (the tag/version and
# changelog checks below enforce it). docs/DESIGN.md has the full steps.
# Publishing on `release: published` means a tag push alone does not publish.
#
# Green does not mean live. The registry first records a 0.0.0-stage
# placeholder, answers "being processed", and serves the version about a minute
# later; until then the packument still 404s and a second publish of the same
# version is refused with "409 Cannot publish over previously staged version".
# Hand-dispatching this workflow is therefore only useful for a version that
# does not exist yet — otherwise it stops at that 409.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # exchanged for a short-lived publish token; required

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Syntax-check every module
        run: npm run check

      - name: Deterministic suites (no network)
        run: npm test

      - name: Require the release tag and CHANGELOG.md to match package.json
        if: github.event_name == 'release'
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag '$tag' does not match package.json version '$pkg'"
            exit 1
          fi
          if ! grep -q "^## \[$pkg\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $pkg; run npm run changelog"
            exit 1
          fi

      # `npm publish`, not `pnpm publish`: pnpm does not perform the OIDC
      # trusted-publishing exchange.
      - name: Publish to npm
        run: npm publish --access public
