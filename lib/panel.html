<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The page/engine boundary this document implements. The engine reads it
      here rather than trusting the host's own version, because *this document*
      is what decides whether to defer audio ownership — and unlike the running
      host module, it is re-read from disk on every plugin mount. Keep it in
      step with PANEL_CONTRACT in lib/client.js and lib/router.js.
    -->
    <meta name="dsh-music-panel-contract" content="2" />
    <title>Music · music.163.com</title>
    <style>
      /* DSH's light palette (base background, primary label, scrollbar). The
         page follows the shell's theme while it sits inside DSH, and the
         system's otherwise; see syncShellTheme. Every other colour is mixed
         from these. */
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --fg: #0f1115;
        --scrollbar-thumb: #e5e5e5;
        --scrollbar-thumb-hover: #d4d4d4;
        --muted: color-mix(in srgb, var(--fg) 56%, transparent);
        --faint: color-mix(in srgb, var(--fg) 38%, transparent);
        --line: color-mix(in srgb, var(--fg) 12%, transparent);
        --panel: color-mix(in srgb, var(--fg) 4%, transparent);
        --hover: color-mix(in srgb, var(--fg) 7%, transparent);
        --accent: #e8503a;
        --accent-soft: color-mix(in srgb, var(--accent) 13%, transparent);
        --radius: 12px;
        --gap: 16px;
      }
      /* DSH's dark palette: the system's choice standalone, the shell's inside DSH. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #151517;
          --fg: #f9fafb;
          --scrollbar-thumb: #3c3c3d;
          --scrollbar-thumb-hover: #545557;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #151517;
        --fg: #f9fafb;
        --scrollbar-thumb: #3c3c3d;
        --scrollbar-thumb-hover: #545557;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        background: var(--bg); color: var(--fg); overflow: hidden;
      }
      button, input, select { font: inherit; color: inherit; }
      button {
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        padding: 5px 10px; cursor: pointer; white-space: nowrap;
      }
      button:hover:not(:disabled) { background: var(--hover); }
      /* The trip to NetEase is not instant on a cold cache; a click has to look
         like it landed before the rows come back. */
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      input, select {
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
      }
      input:focus, select:focus, button:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
      /* One icon set, one stroke: every icon on the page is drawn the same way,
         and a state fills the outline rather than swapping in another glyph. */
      svg.i { display: block; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
      svg.i.filled { fill: currentColor; }
      svg.i.small { width: 14px; height: 14px; }

      /* Scrollbars as DSH draws them in its conversation and everywhere else
         (dsh-client-ui-theme's scrollbar.css): a 5px rounded thumb on no
         track, darker under the pointer. */
      @supports not selector(::-webkit-scrollbar) {
        * { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }
      }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: none; }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); background-clip: content-box; border-radius: 999px; }
      ::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-thumb-hover); }
      ::-webkit-scrollbar-corner { background: none; }
      /* Inside a card, the thumb keeps clear of the rounded corners, as DSH's own cards do. */
      .card ::-webkit-scrollbar-track { margin-block: 6px; }

      /* ------------------------------------------------------------ layout
         Wide: the stage (what is playing) on the left, what comes next — the
         DJ and the queue — on the right, each column scrolling on its own.
         Narrow: one column, the whole page scrolling. */
      #app { display: flex; flex-direction: column; height: 100%; }
      header {
        display: flex; align-items: center; gap: 10px; padding: 10px var(--gap);
        border-bottom: 1px solid var(--line); flex: none;
      }
      .brand { font-weight: 650; letter-spacing: 0.2px; }
      .brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
      .spacer { flex: 1; }
      #account { display: flex; align-items: center; gap: 7px; color: var(--muted); min-width: 0; }
      #account span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #account img { width: 22px; height: 22px; border-radius: 50%; flex: none; }

      main { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
      .stage, .side { display: flex; flex-direction: column; gap: var(--gap); padding: var(--gap); min-width: 0; }
      @media (max-width: 859px) {
        /* Stacked, the two columns share one gap rather than two paddings. */
        .side { padding-top: 0; }
      }
      @media (min-width: 860px) {
        main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 30%); overflow: hidden; }
        .stage { overflow: auto; }
        .side { overflow: hidden; border-left: 1px solid var(--line); }
        .side .queue-card { flex: 1; min-height: 0; }
        .side #queue { overflow: auto; }
        /* With a column of its own, the details or lyrics fill what the stage
           leaves. The floor is the header and two lines: any higher and a short
           window scrolls the whole column as well as the card. */
        .stage .info-card { flex: 1; min-height: 72px; }
        .stage .lyrics, .stage .details { flex: 1; max-height: none; }
      }

      .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
      .card-head {
        display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px;
        color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
      }
      .card-head .grow { flex: 1; }
      .link {
        background: none; border: 0; padding: 0; color: var(--muted); font: inherit;
        text-transform: inherit; letter-spacing: inherit;
      }
      .link:hover:not(:disabled) { background: none; color: var(--fg); }

      /* ------------------------------------------------------------- stage */
      .np { display: flex; gap: 18px; align-items: flex-end; }
      /* The frame holds the place, with a note in it, while there is no cover. */
      .cover {
        position: relative; width: clamp(96px, 22vw, 180px); aspect-ratio: 1; flex: none;
        border-radius: var(--radius); overflow: hidden; background: var(--panel);
        display: grid; place-items: center; color: var(--faint); font-size: 40px;
        box-shadow: 0 6px 24px color-mix(in srgb, #000 14%, transparent);
      }
      #cover-icon { display: grid; place-items: center; width: 38%; height: 38%; }
      #cover-icon svg.i { width: 100%; height: 100%; stroke-width: 1.5; }
      #cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .np-text { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
      .now-title { font-size: 22px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
      .now-artists { font-size: 14px; }
      .now-album { color: var(--muted); }
      /* What to do about this track: the taste switchers and the boosts. A
         state is an accent icon on a tint, never a solid block — the only
         filled control on the stage is play. */
      .taste { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
      .taste button {
        width: 34px; height: 34px; padding: 0; border-radius: 50%; display: grid; place-items: center;
        background: none; color: var(--muted);
      }
      .taste button:hover:not(:disabled) { color: var(--fg); background: var(--hover); }
      .taste button.on { color: var(--accent); background: var(--accent-soft); border-color: transparent; }

      .progress { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
      input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; border: 0; padding: 0; height: 16px; flex: 1; min-width: 0; }
      input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--fg) 16%, transparent); }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: var(--accent); }
      input[type="range"]:focus { outline: none; }

      .transport { display: flex; align-items: center; justify-content: center; gap: 14px; }
      .transport button { width: 40px; height: 40px; padding: 0; border-radius: 50%; display: grid; place-items: center; background: none; border-color: transparent; }
      .transport button:hover:not(:disabled) { background: var(--hover); }
      .transport #play { width: 52px; height: 52px; background: var(--accent); color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
      .transport #play:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, #000); }
      .transport svg.i { width: 20px; height: 20px; }
      .transport #play svg.i { width: 22px; height: 22px; }

      .secondary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
      .secondary select, .secondary > button { padding: 4px 8px; font-size: 12px; }
      #quality-info { color: var(--muted); }
      #mute { background: none; border-color: transparent; padding: 4px; color: var(--muted); }
      #mute:hover:not(:disabled) { color: var(--fg); }
      #volume { flex: 0 0 96px; }

      .info-card { display: flex; flex-direction: column; min-height: 0; }
      .tabs { display: flex; gap: 14px; }
      .tab {
        background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 0 0 2px;
        color: var(--muted); font: inherit; text-transform: inherit; letter-spacing: inherit;
      }
      .tab:hover:not(:disabled) { background: none; color: var(--fg); }
      .tab.on { color: var(--fg); border-bottom-color: var(--accent); }
      .lyrics[hidden], .details[hidden] { display: none; }
      /* The pane is a glance at the current line, not a page: a few lines of
         synced text, scrolled for the rest. `--lyrics-lines` is the single knob. */
      .lyrics {
        --lyrics-lines: 6;
        max-height: calc(var(--lyrics-lines) * 1.6em + var(--lyrics-lines) * 4px + 14px);
        overflow: auto; padding: 2px 12px 14px; font-size: 14px; line-height: 1.6; scrollbar-width: none;
      }
      .lyrics::-webkit-scrollbar { display: none; }
      .lyrics p { margin: 0; padding: 2px 0; color: var(--faint); transition: color 0.15s; }
      .lyrics p.on { color: var(--fg); font-weight: 600; }

      /* The song's facts first, then prose about the song, its artists and its
         album, each clamped to a few lines until clicked. */
      .details {
        max-height: 320px; overflow: auto; padding: 2px 12px 14px;
        display: flex; flex-direction: column; gap: 12px;
      }
      .details .alias { color: var(--muted); margin: 0; }
      .facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 14px; margin: 0; }
      .facts dt { color: var(--muted); }
      .facts dd { margin: 0; overflow-wrap: anywhere; }
      .chips { display: flex; flex-wrap: wrap; gap: 4px; }
      .chip { padding: 0 8px; border-radius: 999px; background: var(--hover); font-size: 12px; }
      .chip.genre { background: var(--accent-soft); }
      .about h4 {
        margin: 0 0 3px; color: var(--muted); font-size: 11px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.6px;
      }
      .about .prose {
        cursor: pointer;
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden;
      }
      .about .prose.open { display: block; }
      .about .prose p { margin: 0; }
      .about .prose p + p { margin-top: 8px; }
      .about .by { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .about .badge {
        margin-left: 6px; padding: 0 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent);
        font-size: 10px; letter-spacing: 0.4px;
      }
      .about .written { cursor: pointer; }
      .about .written p { margin: 0; }
      .about .written p + p { margin-top: 8px; }
      .about .writing { color: var(--muted); margin: 0; }
      .details .source { align-self: flex-start; font-size: 12px; }

      /* Notices float over the page just below the header instead of taking
         a place in it: one that comes and goes, such as the autoplay banner,
         must not move what the listener is about to click. */
      header { position: relative; }
      #notices {
        position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); z-index: 30;
        width: max-content; max-width: calc(100% - 2 * var(--gap));
        display: flex; flex-direction: column; gap: 6px; pointer-events: none;
      }
      #notices > * { pointer-events: auto; }
      .need-gesture {
        background: color-mix(in srgb, var(--accent) 13%, var(--bg)); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
        border-radius: var(--radius); padding: 8px 12px; font-size: 12px;
        box-shadow: 0 6px 20px color-mix(in srgb, #000 18%, transparent);
      }

      /* -------------------------------------------------------------- side */
      .dj-card { padding-bottom: 12px; flex: none; }
      .dj-card .card-head { padding-bottom: 8px; }
      .dj-card .card-head .title { color: var(--fg); font-size: 13px; font-weight: 650; text-transform: none; letter-spacing: 0; }
      .dj-body { display: flex; flex-direction: column; gap: 8px; padding: 0 12px; font-size: 12px; }
      #dj-prompt { width: 100%; }
      /* A switch reads on or off at a glance: the DJ, the listening history. */
      .switch {
        position: relative; width: 38px; height: 22px; padding: 0; border-radius: 11px;
        background: color-mix(in srgb, var(--fg) 20%, transparent); border: 0; color: transparent; overflow: hidden;
      }
      .switch::after {
        content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
        background: #fff; transition: transform 0.15s; box-shadow: 0 1px 3px color-mix(in srgb, #000 30%, transparent);
      }
      .switch.on { background: var(--accent); }
      .switch.on::after { transform: translateX(16px); }
      .switch:hover:not(:disabled) { filter: brightness(0.96); }
      /* The listening-history switch only means something signed in. */
      .history { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
      .history[hidden] { display: none; }
      .plan b { color: var(--accent); }
      .plan .muted, .muted { color: var(--muted); }
      .plan > div + div { margin-top: 2px; }

      #boosts:empty { display: none; }
      #boosts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); }
      #boosts .boost {
        display: inline-flex; gap: 2px; align-items: center; color: var(--fg);
        background: var(--accent-soft); border-radius: 999px; padding: 1px 2px 1px 9px;
      }
      #boosts .boost button { border: 0; background: none; padding: 2px 5px; color: var(--muted); }
      #boosts .boost button:hover:not(:disabled) { color: var(--fg); }

      /* The DJ model picker is a set-once setting, so it keeps only its header
         row until asked. The header is the click target; the chevron inside it
         is the keyboard one. */
      .model { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; }
      .model-head { display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
      .model-head .model-now {
        flex: 1; min-width: 0; text-align: right; color: var(--muted);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .model-head .toggle { background: none; border: 0; margin: 0; padding: 0 2px; font: inherit; color: var(--muted); }
      .model-head .toggle:hover:not(:disabled) { background: none; color: var(--fg); }
      .model-head .warn { color: var(--accent); }
      .dj-model-body.collapsed { display: none; }
      .row-inline { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
      .row-inline select, .row-inline input { flex: 1 1 0; min-width: 0; font-size: 12px; padding: 4px 6px; }
      .row-inline button { font-size: 12px; padding: 4px 8px; }

      .queue-card { display: flex; flex-direction: column; overflow: hidden; }
      #queue { padding: 0 6px 6px; }
      .row { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 8px; cursor: pointer; }
      .row:hover { background: var(--hover); }
      .row.playing { background: var(--accent-soft); }
      .row.playing .name { color: var(--accent); font-weight: 600; }
      .row .idx { width: 20px; text-align: right; color: var(--faint); font-variant-numeric: tabular-nums; flex: none; font-size: 12px; }
      .row.playing .idx { color: var(--accent); display: grid; justify-items: end; }
      .row img { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex: none; background: var(--panel); }
      .row .meta { min-width: 0; flex: 1; }
      .row .name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row .sub { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row .tag { font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); flex: none; }
      .row .dur { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; font-size: 12px; min-width: 32px; text-align: right; }
      .row .acts { display: none; gap: 4px; flex: none; }
      .row .acts button { padding: 3px 5px; background: none; color: var(--muted); }
      .row .acts button:hover:not(:disabled) { color: var(--fg); }
      .row:hover .acts { display: flex; }
      /* The list's own like control. A liked track keeps its filled heart
         visible; the hollow one only appears on hover, so an unrated list is
         not a wall of outlines. */
      .row .heart {
        background: none; border: 0; padding: 0; flex: none;
        color: var(--muted); opacity: 0; transition: opacity 0.12s;
      }
      .row:hover .heart { opacity: 1; }
      .row .heart.on { opacity: 1; color: var(--accent); }
      .empty { padding: 24px 14px; color: var(--muted); text-align: center; }

      .toast {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 9px; font-size: 12px;
        opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 40; max-width: 80%;
      }
      .toast.on { opacity: 0.94; }
      dialog {
        border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--fg);
        padding: 18px; width: min(340px, 88vw);
      }
      dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
      #qr { display: block; margin: 12px auto; width: 220px; height: 220px; image-rendering: pixelated; border-radius: 8px; background: #fff; padding: 8px; }
      .hint { color: var(--muted); font-size: 12px; text-align: center; }
      .lyrics .hint, .details .hint { text-align: left; margin: 0; }
      .row-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 14px; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand"><span data-i18n="brand">Music</span><small>music.163.com</small></div>
        <div class="spacer"></div>
        <div class="history" id="history" hidden>
          <span id="history-label" data-i18n="scrobbleLabel">Listening history</span>
          <button id="scrobble-toggle" class="switch" role="switch" aria-labelledby="history-label"></button>
        </div>
        <div id="account"></div>
        <div id="notices" aria-live="polite"></div>
      </header>

      <main>
        <section class="stage">
          <div class="np">
            <div class="cover"><span id="cover-icon"></span><img id="cover" alt="" /></div>
            <div class="np-text">
              <div class="now-title" id="np-title" data-i18n="nothingPlaying">Nothing playing</div>
              <div class="now-artists" id="np-artists"></div>
              <div class="now-album" id="np-album"></div>
              <!-- Labels are state-dependent (a filled heart un-likes), so the
                   script owns text and title rather than data-i18n. -->
              <div class="taste">
                <button id="like" title="Like"></button>
                <button id="dislike" title="Dislike"></button>
                <button id="boost-more" title="More like this for an hour"></button>
                <button id="boost-less" title="Fewer like this for an hour"></button>
              </div>
            </div>
          </div>

          <div class="progress">
            <span id="t-cur">0:00</span>
            <input type="range" id="seek" min="0" max="1000" value="0" step="1" />
            <span id="t-dur">0:00</span>
          </div>
          <div class="transport">
            <button id="prev" data-i18n-title="prev" title="Previous"></button>
            <button id="play" data-i18n-title="playPause" title="Play/pause"></button>
            <button id="next" data-i18n-title="next" title="Next"></button>
          </div>
          <div class="secondary">
            <button id="mode" data-i18n-title="modeTitle" data-i18n="modeList" title="Playback mode">List</button>
            <select id="quality" data-i18n-title="qualityTitle" title="Streaming quality"></select>
            <span id="quality-info"></span>
            <span class="spacer"></span>
            <button id="mute" data-i18n-title="mute" title="Mute"></button>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
          </div>

          <div class="card info-card">
            <div class="card-head">
              <div class="tabs" role="tablist">
                <button id="tab-details" class="tab" type="button" role="tab" data-i18n="details">Details</button>
                <button id="tab-lyrics" class="tab" type="button" role="tab" data-i18n="lyrics">Lyrics</button>
              </div>
            </div>
            <div class="details" id="details" role="tabpanel"><p class="hint">—</p></div>
            <div class="lyrics" id="lyrics" role="tabpanel" hidden><p class="hint">—</p></div>
          </div>
        </section>

        <aside class="side">
          <div class="card dj-card">
            <div class="card-head">
              <span class="title">AI DJ</span>
              <span class="grow"></span>
              <button id="dj-toggle" class="switch" role="switch" data-i18n-title="djToggleTitle" title="Continuous AI DJ: keep the queue stocked">AI DJ</button>
            </div>
            <div class="dj-body">
              <input id="dj-prompt" data-i18n-ph="djPromptPh" placeholder="AI DJ mood, e.g. rainy afternoon jazz" />
              <div id="dj-status"></div>
              <div id="boosts"></div>
              <div class="model" id="dj-model">

      function paintStaticIcons() {
        setIcon($('prev'), 'skipBack');
        setIcon($('next'), 'skipForward');
        setIcon($('dislike'), 'x');
        setIcon($('boost-more'), 'more');
        setIcon($('boost-less'), 'less');
        setIcon($('cover-icon'), 'music');

       * The listening-history switch: shown only signed in — there is no history
       * to write to otherwise — and on when plays are being reported.
       */
      function paintHistory() {
        const scrobble = state?.scrobble;
        const signedIn = Boolean(state?.authenticated);
        $('history').hidden = !signedIn || !scrobble;
        const on = Boolean(scrobble?.enabled);
        $('scrobble-toggle').classList.toggle('on', on);
        $('scrobble-toggle').setAttribute?.('aria-checked', String(on));
        $('scrobble-toggle').title = t(on ? 'scrobbleOnTitle' : 'scrobbleOffTitle');

      /** One icon as markup; `filled` fills the outline, `small` is the compact size. */
      function icon(name, { filled = false, small = false } = {}) {
        const classes = ['i', filled ? 'filled' : '', small ? 'small' : ''].filter(Boolean).join(' ');
        return `<svg class="${classes}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
      }

      /** Paint an icon into `el`, touching the DOM only when it changes. */
      function setIcon(el, name, options = {}) {
        const key = `${name}${options.filled ? ':filled' : ''}`;
        if (!el || el.dataset.icon === key) return;
        el.dataset.icon = key;
        el.innerHTML = icon(name, options);

       * Rewriting identical rows on every update replaced every node in them,
       * which dropped hover, focus and a click caught mid-swap.
       *
       * @returns {boolean} whether the markup was written.
       */
      function setHtml(el, html) {
        if (!el || painted.get(el) === html) return false;
        painted.set(el, html);
        el.innerHTML = html;
        return true;
      }

      function setText(el, text) {
        if (el && el.textContent !== text) el.textContent = text;

        let text = DICT[LANG]?.[key] ?? DICT.en[key] ?? key;
        if (vars) {

      const detailsLoads = new Map();
      /**
       * Model-written introductions by `<track id>:<language>`: `'pending'`
       * while one is being written, then `{text}`, empty when none could be.
       */
      const intros = new Map();
      /** Whether the last introduction came back empty, so the next track shows NetEase's prose while it waits. */
      let introsUnavailable = false;
      /** Which introduction the details show: `ai`, or NetEase's own (`netease`). Back to `ai` per track. */
      let introSource = 'ai';
      /** Local-storage key for whether the DJ model form is unfolded. */
      const DJ_MODEL_PREF = 'dsh-music.djmodel.expanded';
      let djModelExpanded = readDjModelPref();
      let volumePostAt = 0;

      const fmt = (ms) => {
        const total = Math.max(Math.floor((ms || 0) / 1000), 0);
        return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
      };
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      /** The newest snapshot version adopted; see {@link newest}. */
      let versionFloor = 0;
