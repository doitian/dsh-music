       * state shown. A request's answer and a pushed frame travel on different
       * connections, so one read earlier can land later, and adopting it would
       * undo the newer one with nothing coming to repair it. Answers are
       * ordered by `version`, which moves with anything shown — not `rev`,
       * which a setting or a resolved like leaves alone. Only while the stream
       * is open: without it the next poll repairs any such swap, and a
       * reconnect drops the floor, since a restarted host counts its versions
       * from zero again.
       */
      function newest(next) {
        const version = Number(next?.version);
        if (!Number.isFinite(version)) return next;
        if (streaming && version < versionFloor) return state;
        versionFloor = version;
        return next;
      }

      let toastTimer;
      function toast(message) {
        const el = $('toast');
        el.textContent = message;
        el.classList.add('on');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('on'), 2600);
      }

      async function api(path, options) {
        const response = await fetch(API + path, {
          headers: { 'Content-Type': 'application/json' },
          ...options,
          ...(options && options.body ? { body: JSON.stringify(options.body) } : {}),
        });
        const text = await response.text();
        let data;
        try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text.slice(0, 200) }; }
        if (!response.ok) {
          const error = new Error(data.error || data.message || 'HTTP ' + response.status);
          // The host's machine-usable half. This page localizes around it
          // (login does the same) instead of showing a raw English sentence.
          if (data.code) error.code = data.code;
          throw error;
        }
        return data;
      }

      /**
       * Tell the host a user-facing failure in the page's own language when the
       * reason is one the page knows, and let the host's words through when it
       * is not (a NetEase refusal carries its own explanation).
       */
      function failureText(error) {
        if (error.code === 'ANONYMOUS') return t('likeNeedsSignIn');
        return error.message;
      }

      // ------------------------------------------------------------- transport
      /**
       * Who plays the audio.
       *
       * Normally the client plugin's engine in the shell document owns it: the
       * layout renders only the ACTIVE `main` slot entry, so this document is
       * unmounted the moment the user opens a session, and playback has to
       * outlive that. The page is then a remote control over the host's state.
       *
       * The engine is not guaranteed to exist or to be usable, though: this
       * page is re-read from disk on every plugin mount, while the browser
       * bundle it pairs with is pinned to its own revision. When they disagree
       * the engine declares itself inert. Rather than go silent, this page then
       * owns the `<audio>` element itself — the older behaviour, which still
       * plays, only without surviving a panel switch.
       */
      function shellEngine() {
        try {
          const candidate = window.parent?.__dshMusicEngine;
          // Only an engine that declares it actually plays is authoritative;
          // anything else (including an older bundle's engine) would leave the
          // audio element unowned.
          return candidate?.playback === true ? candidate : undefined;
        } catch {
          return undefined;
        }
      }

      /** @type {object | undefined} */
      let localTransport;

      /** The active transport, creating the local fallback on first use. */
      function transport() {
        const engine = shellEngine();
        if (engine) {
          if (localTransport) {
            localTransport.dispose();
            localTransport = undefined;
          }
          return engine;
        }
        if (!localTransport) {
          // Stand down any engine that cannot play, so exactly one transport
          // owns the audio element and nothing plays twice.
          try { window.parent?.__dshMusicEngine?.dispose?.(); } catch { /* ignore */ }
          localTransport = createLocalTransport();
        }
        return localTransport;
      }

      /**
       * Origin that serves audio bytes. Under the desktop shell this page runs on
       * the `dsh-app://` custom scheme, which Chromium cannot byte-range, so seeks
       * restart the track; the shell publishes its HTTP origin on the parent
       * window instead. Without one, relative URLs keep the page's own origin.
       */
      function streamOrigin() {
        try {
          const base = window.parent?.__DSH_TRANSPORT__?.streamBaseUrl;
          if (typeof base === 'string' && base) return new URL(base).origin;
        } catch { /* a cross-origin parent, or a malformed base */ }
        return '';
      }

      /**
       * The fallback transport: this page owns an `<audio>` element.
       *
       * It runs the shell engine's playback core, `playback.js`, which this
       * page loads from its own host rather than from the bundle — the bundle
       * is exactly what this fallback cannot trust. The core reconciles on
       * `transportRev` but enforces play/pause on every update, as the engine
       * does: a refused `play()` does not change the revision, so gating the
       * retry would stop the music for good after the first browser refusal.
       */
      function createLocalTransport() {
        const playback = window.__dshMusicPlayback.createPlayback({
          base: BASE,
          streamOrigin,
          call: api,
          report(extra) {
            if (!state?.current) return;
            api('/report', {
              method: 'POST',
              body: { trackId: state.current.id, ...playback.progress(), ...extra },
            }).catch(() => { /* the next update carries the host's view */ });
          },
        });
        playback.audio.addEventListener('timeupdate', () => { paintProgress(); paintLyrics(); });

        return {
          playback: true,
          local: true,
          apply: playback.apply,
          sync() { playback.apply(state); },
          playNow: playback.playNow,
          /** Exact position: this transport owns the element. A held seek counts as already there. */
          position: playback.position,
          dispose: playback.dispose,
        };
      }

      /** Push the latest host state into whichever transport is active. */
      function applyTransport() {
        const active = transport();
        try {
          active.apply?.(state);
        } catch { /* a failing transport must not break rendering */ }
      }

      /** Ask the active transport to act now instead of on its next update. */
      function pokeEngine() {
        try { transport().sync?.(); } catch { /* best effort across documents */ }
      }

      async function control(body) {
        try {
          state = newest(await api('/control', { method: 'POST', body }));
          render();
          applyTransport();
        } catch (error) { toast(error.message); }
        pokeEngine();
      }

      /**
       * Playback position.
       *
       * The transport reads its own element when it can — the local one, and
       * the shell engine, whose document this page can reach. An engine from
       * an older bundle has no `position()`, so its last report to the host is
       * used, with the time since added back; the host pushes no frame for a
       * report that only moves the position, so that report can be minutes old.
       */
      function positionMs() {
        const active = transport();
        if (typeof active.position === 'function') return active.position();
        const reported = state?.reported ?? {};
        const base = Number(reported.position) || 0;
        if (!state?.playing || !reported.playing) return base;
        const at = Number(reported.at) || 0;
        return at ? base + Math.max(Date.now() - at, 0) : base;
      }

      /** Duration the transport knows, falling back to the track's metadata. */
      function durationMs() {
        const reported = Number(state?.reported?.duration) || 0;
        return reported > 0 ? reported : Number(state?.current?.duration) || 0;
      }

      /**
       * The host wants playback, and the transport reported that the browser
       * refused to start it until the page is interacted with.
       *
       * Only the refusal counts. "Wanted but not playing" alone is also true
       * for the half second after any Play click, before the transport has
       * caught up — which flashed this hint on every press.
       */
      function autoplayBlocked() {
        const reported = state?.reported;
        return Boolean(state?.playing && state?.current && reported?.blocked === true && reported.playing === false);
      }

      /**
       * Start audio from inside this click.
       *
       * The gesture grants sticky user activation to the document that owns the
       * element — this one for the local transport, the shell document for the
       * engine, as activation propagates up the same-origin frame tree.
       * `playNow()` fires the attempt synchronously; the repeats cover the
       * propagation order and any attempt already in flight.
       */
      function resumeWithGesture() {
        const attempt = () => {
          try { transport().playNow?.(); } catch { /* ignore */ }
          pokeEngine();
        };
        attempt();
        setTimeout(attempt, 200);
        setTimeout(attempt, 800);
        toast(t('resuming'));
      }

      // ---------------------------------------------------------------- render
      function render() {
        if (!state) return;
        const track = state.current;
        const cover = track?.picUrl || '';
        // Setting the same `src` again restarts the image load.
        if ($('cover').dataset.src !== cover) {
          $('cover').dataset.src = cover;
          $('cover').src = cover;
        }
        $('cover').style.visibility = cover ? 'visible' : 'hidden';
        setText($('np-title'), track ? track.name : t('nothingPlaying'));
        setText($('np-artists'), track ? (track.artists || []).join(' / ') : '');
        setText($('np-album'), track ? track.album || '' : '');
        // Details and lyrics belong to the track, and this page fetches them
        // itself on every update — not from the local transport's `applySource`,
        // which only ever runs when this page owns the audio element. In the
        // normal case the shell engine plays, so that path is dead and the
        // pane stayed empty forever.
        syncInfo(track?.id ?? null);
        loadIntro();
        prefetchNextDetails();
        setIcon($('play'), state.playing ? 'pause' : 'play', { filled: true });
        setText($('mode'), { list: t('modeList'), single: t('modeSingle'), shuffle: t('modeShuffle') }[state.mode] || t('modeList'));
        $('queue-clear').disabled = (state.queue?.length ?? 0) <= (state.current ? 1 : 0);
        $('dj-toggle').classList.toggle('on', Boolean(state.dj?.enabled));
        paintHistory();
        // The mood brief is persisted player setting, not part of the DJ status
        // block, so it comes from `settings`.
        if (document.activeElement !== $('dj-prompt')) $('dj-prompt').value = state.settings?.djPrompt ?? '';

        // Account chip
        const account = state.account;
        const chip = account
          ? `${account.avatar ? `<img src="${esc(account.avatar)}" alt="">` : ''}<span>${esc(account.nickname)}${account.vip ? ' · VIP' : ''}</span>`
          : `<button id="signin">${esc(t('signin'))}</button>`;
        if (setHtml($('account'), chip)) {
          const signin = $('signin');
          if (signin) signin.onclick = openLogin;
        }

        // DJ status
        const dj = state.dj || {};
        setHtml($('dj-status'), dj.enabled || dj.lastPlan
          ? `<div class="plan">${dj.busy ? esc(t('djPlanning')) : dj.error ? `AI DJ: ${esc(dj.error)}` : ''}${
              dj.lastPlan
                ? `<div><b>+${dj.lastPlan.added}</b> ${esc(dj.lastPlan.vibe || '')}</div><div class="muted">${esc((dj.lastPlan.names || []).slice(-3).join(' · '))}</div>`
                : ''
            }${dj.modelError && !dj.lastPlan?.route ? `<div class="muted">${esc(t('modelTierUnavailable'))}: ${esc(dj.modelError)}</div>` : ''}${dj.lastPlan?.source === 'heuristic' ? `<div class="muted">${esc(t('heuristics'))}</div>` : ''}</div>`
          : '');

        if (autoplayBlocked()) {
          if (!$('gesture')) {
            const el = document.createElement('div');
            el.id = 'gesture';
            el.className = 'need-gesture';
            el.innerHTML = `${esc(t('gestureText'))} — <button id="gesture-go" class="primary">${esc(t('gesturePlay'))}</button> <span style="color:var(--muted)">${esc(t('gestureNote'))}</span>`;
            $('notices').append(el);
            el.querySelector('#gesture-go').onclick = resumeWithGesture;
          }
        } else {
          $('gesture')?.remove();
        }

        // The engine owns the real volume; mirror it unless the user is
        // mid-drag, when overwriting the thumb would fight the pointer.
        if (document.activeElement !== $('volume')) $('volume').value = state.volume;
        setIcon($('mute'), state.muted || state.volume === 0 ? 'muted' : 'volume');

        // Same for quality: the host is authoritative, the select mirrors it.
        const preferredLevel = state.audio?.preferred;
        if (
          preferredLevel &&
          document.activeElement !== $('quality') &&
          qualityLevels.some((entry) => entry.id === preferredLevel)
        ) {
          $('quality').value = preferredLevel;
        }
        paintQualityInfo();

        renderQueue();
        paintTaste();
        paintProgress();
      }

      /**
       * Rows the queue list shows at most. The host keeps the full queue (and
       * the play history backing the stats), but the panel only paints a
       * sliding window around the cursor so old, already-played tracks drop
       * out of view instead of piling up.
       */
      const MAX_VISIBLE_ROWS = 30;

      function renderQueue() {
        if (!state) return;
        const queue = state.queue || [];
        const total = state.counts ? `(${state.counts.queued})` : '';
        if (queue.length === 0) {
          setText($('counts'), total);
          // Emptying the list dropped its scroll position, so a queue restored
          // with the same song playing has to be revealed again.
          if (setHtml($('queue'), `<div class="empty">${esc(t('queueEmpty'))}</div>`)) {
            revealedRow = null;
            revealing = null;
          }
          return;
        }
        // A window of at most MAX_VISIBLE_ROWS rows that always includes the
        // current track: up to four played rows above it for context, the rest
        // upcoming. Row numbers stay absolute, so trimmed rows read as a gap
        // in the numbering, and the counts line names the visible range.
        const cursor = state.index < 0 ? 0 : state.index;
        const start = Math.max(0, Math.min(cursor - 4, queue.length - MAX_VISIBLE_ROWS));
        const end = Math.min(queue.length, start + MAX_VISIBLE_ROWS);
        setText($('counts'), end - start < queue.length ? `(${start + 1}–${end} / ${queue.length})` : total);
        setHtml($('queue'), queue
          .slice(start, end)
          .map((track, offset) => {
            const index = start + offset;
            const playing = index === state.index;
            return `<div class="row ${playing ? 'playing' : ''}" data-jump="${index}">
              <span class="idx">${playing ? icon('play', { filled: true, small: true }) : index + 1}</span>
              <img src="${esc(track.picUrl || '')}" alt="" loading="lazy">
              <span class="meta"><span class="name">${esc(track.name)}</span><span class="sub">${esc((track.artists || []).join(' / '))}</span></span>
              ${track.vip ? '<span class="tag">VIP</span>' : ''}
              <button class="heart ${track.liked ? 'on' : ''}" data-like="${index}" title="${esc(t(track.liked ? 'unlike' : 'like'))}">${icon('heart', { filled: track.liked, small: true })}</button>
              <span class="dur">${fmt(track.duration)}</span>
              <span class="acts"><button data-remove="${index}" title="${esc(t('remove'))}">${icon('x', { small: true })}</button></span>
            </div>`;
          })
          .join(''));
        revealPlayingRow();
      }

      /** The playing row the queue last scrolled to, as `index:trackId`. */
      let revealedRow = null;

      /**
       * A smooth reveal still under way: the list edge the row is headed for
       * and the scroll position that lands it there.
       */
      let revealing = null;

      // A reveal ends when the list comes to rest, or when the user scrolls it
      // themselves.
      for (const type of ['scrollend', 'wheel', 'touchstart', 'pointerdown', 'keydown']) {
        $('queue').addEventListener(type, () => { revealing = null; }, { passive: true });
      }

      /**
       * Bring the playing row into the queue's view when a new song starts.
       *
       * Only on a change of song: the list is re-rendered on every update, and
       * scrolling then would yank it back while the user browses what comes
       * next. Only the list itself scrolls — stacked in a narrow window the list
       * does not scroll on its own, and moving the whole page for it would lose
       * whatever the user is reading on the stage. A row already in view stays
       * put; the first paint jumps, later songs glide.
       */
      function revealPlayingRow() {
        const list = $('queue');
        const row = list.querySelector('.row.playing');
        if (!row || list.offsetParent === null) return;
        const key = `${state.index}:${state.current?.id}`;
        if (key === revealedRow) {
          followReveal(list, row);
          return;
        }
        const first = revealedRow === null;
        revealedRow = key;
        revealing = null;
        const view = list.getBoundingClientRect();
        const box = row.getBoundingClientRect();
        const edge = box.top < view.top ? 'top' : box.bottom > view.bottom ? 'bottom' : null;
        if (!edge) return;
        const top = revealTarget(list, row, edge);
        if (first || matchMedia('(prefers-reduced-motion: reduce)').matches) {
          list.scrollTo({ top, behavior: 'instant' });
          return;
        }
        revealing = { edge, top };
        list.scrollTo({ top, behavior: 'smooth' });
      }

      /**
       * Keep a glide aimed at the row when a repaint moves it.
       *
       * Songs landing in a short queue slide the painted window, and the row
       * with it, while the list is still scrolling to where the row was. A glide
       * that has arrived is left alone: from then on a moving row is a change of
       * queue, not of song.
       */
      function followReveal(list, row) {
        if (!revealing) return;
        if (Math.abs(list.scrollTop - revealing.top) < 1) {
          revealing = null;
          return;
        }
        const top = revealTarget(list, row, revealing.edge);
        if (Math.abs(top - revealing.top) < 1) return;
        revealing.top = top;
        list.scrollTo({ top, behavior: 'smooth' });
      }

      /**
       * The scroll position that puts the row at one edge of the list, with
       * half a row of its neighbours showing so it does not land flush against
       * the card's edge.
       */
      function revealTarget(list, row, edge) {
        const view = list.getBoundingClientRect();
        const box = row.getBoundingClientRect();
        const margin = box.height / 2;
        const top = edge === 'top'
          ? list.scrollTop + box.top - view.top - margin
          : list.scrollTop + box.bottom - view.bottom + margin;
        return Math.max(0, Math.min(top, list.scrollHeight - list.clientHeight));
      }

      /**
       * The transport row's taste controls mirror the current track.
       *
       * A filled heart is the account's like and a filled ✕ the local dislike,
       * and a click moves the track to the *other* level — so the label has to
       * say which direction, which is why the titles are painted here rather
       * than carried as `data-i18n` on the markup.
       */
      function paintTaste() {
        const track = state?.current;
        const liked = Boolean(track?.liked);
        const disliked = Boolean(track?.disliked);
        setIcon($('like'), 'heart', { filled: liked });
        $('like').classList.toggle('on', liked);
        $('like').title = t(liked ? 'unlike' : 'like');
        $('dislike').classList.toggle('on', disliked);
        $('dislike').title = t(disliked ? 'undislike' : 'dislike');
        // A filled arrow is the boost in force; clicking it clears the boost.
        const boost = track?.boost ?? null;
        $('boost-more').classList.toggle('on', boost === 'more');
        $('boost-more').title = t(boost === 'more' ? 'boostClear' : 'boostMore');
        $('boost-less').classList.toggle('on', boost === 'less');
        $('boost-less').title = t(boost === 'less' ? 'boostClear' : 'boostLess');
        paintBoosts();
      }

      /**
       * The boosts in force, each with its time left and a ✕ to end it early —
       * so a temporary push is never invisible, and never outlives the mood.
       */
      function paintBoosts() {
        const boosts = state?.boosts ?? [];
        const now = Date.now();
        setHtml($('boosts'), boosts.length
          ? `<span>${esc(t('boostsTitle'))}:</span>` +
            boosts
              .map((boost) => {
                const minutes = Math.max(Math.round((boost.until - now) / 60_000), 1);
                return `<span class="boost">${icon(boost.direction === 'more' ? 'more' : 'less', { small: true })} ${esc(boost.name)} · ${esc(t('boostMinutes', { n: minutes }))}<button data-unboost="${boost.id}" title="${esc(t('boostClear'))}">${icon('x', { small: true })}</button></span>`;
              })
              .join('')
          : '');
      }

      /** Boost a track, or clear its boost with `none`, and adopt the host's answer. */
      async function sendBoost(trackId, direction, button) {
        if (button) button.disabled = true;
        try {
          state = newest(await api('/boost', { method: 'POST', body: { trackId, direction } }));
          render();
          applyTransport();
          toast(t(direction === 'more' ? 'boostedMore' : direction === 'less' ? 'boostedLess' : 'boostCleared'));
        } catch (error) {
          toast(failureText(error));
        } finally {
          if (button) button.disabled = false;
        }
      }

      /**
       * Take one track out of the queue.
       *
       * This is the queue endpoint, not `/taste`: the host drops the row and, in
       * the same request, reads the removal as a dislike of a track that carries
       * no level yet — so the row does not come straight back from the DJ's next
       * batch. `/taste` alone only writes the level, which leaves the row in the
       * list, and its NetEase half can be refused, which must never keep a row
       * the click asked to remove.
       *
       * @returns {Promise<boolean>} whether the row really left the queue, so the
       *   caller's confirm describes the removal the click asked for and not the
       *   judgement the host makes of it.
       */
      async function removeFromList(index, button) {
        const track = state?.queue?.[index];
        if (!track) return false;
        // The trip to NetEase is not instant on a cold cache, so a second click
        // mid-flight is locked out, exactly as the transport switchers do.
        if (button) button.disabled = true;
        try {
          state = newest(await api('/queue', { method: 'POST', body: { action: 'remove', index } }));
          // Read the answer off the new queue: an index that named a row someone
          // else had already dropped must not claim a removal that did not happen.
          return !(state.queue || []).some((entry) => entry.id === track.id);
        } finally {
          // `render()` replaces the row markup, so this node may be detached —
          // harmless, and it keeps a button the host refused usable.
          if (button) button.disabled = false;
        }
      }

      /**
       * Move one track to a taste level on the host and adopt its answer.
       *
       * `liked` and `none` change the NetEase account and need a session, which
       * the host reports as `code: ANONYMOUS`; `disliked` is local, so it always
       * applies. Returns whether the level really moved, so a caller's toast
       * cannot claim a like NetEase refused.
       */
      async function sendTaste(track, level, button) {
        // The trip to NetEase is not instant on a cold cache. This guards
        // against a second click mid-flight; the row still updates at the end,
        // in the same frame as the toast, so the lag is honest rather than
        // promised.
        if (button) button.disabled = true;
        try {
          state = newest(await api('/taste', { method: 'POST', body: { trackId: track.id, level } }));
          render();
          applyTransport();
          return true;
        } catch (error) {
          toast(failureText(error));
          return false;
        } finally {
          // `render()` replaces the row markup, so this node may be detached —
          // harmless, and it keeps the transport buttons (which are not) usable.
          if (button) button.disabled = false;
        }
      }

      function paintProgress() {
        if (!state || !state.current) return;
        const position = positionMs();
        const duration = durationMs();
        if (document.activeElement !== $('seek')) {
          $('seek').value = duration > 0 ? String(Math.round((position / duration) * 1000)) : '0';
        }
        setText($('t-cur'), fmt(position));
        setText($('t-dur'), fmt(duration));
      }

      // ------------------------------------------------------ details + lyrics
      /** The pane shown, remembered across reloads when storage is open; details by default. */
      function readInfoViewPref() {
        try { return localStorage.getItem(INFO_VIEW_PREF) === 'lyrics' ? 'lyrics' : 'details'; } catch { return 'details'; }
      }

      function saveInfoViewPref(view) {
        try { localStorage.setItem(INFO_VIEW_PREF, view); } catch { /* storage denied */ }
      }

      /** Reflect `infoView` in the tabs and the panes. */
      function paintInfoTabs() {
        for (const view of ['details', 'lyrics']) {
          const on = infoView === view;
          $('tab-' + view).classList.toggle('on', on);
          $('tab-' + view).setAttribute('aria-selected', on ? 'true' : 'false');
          $(view).hidden = !on;
        }
      }

      /**
       * Bring the visible pane up to the track. Only the visible one: a hidden
       * pane is neither fetched nor painted, and catches up when it is shown.
       */
      function syncInfo(trackId) {
        if (infoView === 'details') {
          if (trackId === detailsTrackId) return;
          detailsTrackId = trackId;
          if (trackId) loadDetails(trackId);
          else $('details').innerHTML = '<p class="hint">—</p>';
          return;
        }
        if (trackId === lyricTrackId) return;
        lyricTrackId = trackId;
        if (trackId) loadLyrics(trackId);
        else {
          lyric = null;
          lyricLine = -1;
          $('lyrics').innerHTML = '<p class="hint">—</p>';
        }
      }

      function showInfo(view) {
        if (view === infoView) return;
        infoView = view;
        saveInfoViewPref(view);
        paintInfoTabs();
        syncInfo(state?.current?.id ?? null);
        // A hidden pane kept no scroll position, so showing the lyrics puts the
        // current line back in view instead of waiting for the next line.
        if (view === 'lyrics') {
          lyricLine = -1;
          paintLyrics();
        }
      }

      $('tab-details').onclick = () => showInfo('details');
      $('tab-lyrics').onclick = () => showInfo('lyrics');
      paintInfoTabs();

      // The introduction's switch, or the written one itself, swaps it with
      // NetEase's prose; clamped prose opens in place.
      $('details').onclick = (event) => {
        const source = event.target.closest?.('[data-source]')?.dataset.source ?? (event.target.closest?.('.written') ? 'netease' : null);
        if (source) {
          introSource = source;
          repaintDetails({ keepScroll: true });
          return;
        }
        const prose = event.target.closest?.('.about .prose');
        if (prose) prose.classList.toggle('open');
      };

      /** One track's details, fetched once however many ask, and kept. */
      function fetchDetails(id) {
        if (!detailsLoads.has(id)) {
          const load = api('/info/' + id)
            .then((info) => {
              detailsCache.set(id, info);
              if (detailsCache.size > 30) detailsCache.delete(detailsCache.keys().next().value);
              return info;
            })
            .finally(() => detailsLoads.delete(id));
          detailsLoads.set(id, load);
        }
        return detailsLoads.get(id);
      }

      /**
       * Fetch the next track's details ahead, so they show the moment it
       * starts. Lazy like the introduction: only after the shown track's
       * details have painted, and only while the details are shown.
       * Shuffle has no known next track, and repeat-one's next is this one.
       */
      function prefetchNextDetails() {
        if (infoView !== 'details' || !detailsTrackId || !detailsCache.has(detailsTrackId)) return;
        if (!state || state.mode !== 'list') return;
        const next = state.queue?.[state.index + 1];
        if (!next?.id || detailsCache.has(next.id) || detailsLoads.has(next.id)) return;
        fetchDetails(next.id).catch(() => { /* the track's own load retries */ });
      }

      async function loadDetails(id) {
        const request = ++detailsRequest;
        introSource = 'ai';
        const cached = detailsCache.get(id);
        if (cached) {
          paintDetails(cached);
          setTimeout(afterDetails);
          return;
        }
        $('details').innerHTML = `<p class="hint">${esc(t('loading'))}</p>`;
        try {
          const info = await fetchDetails(id);
          if (request !== detailsRequest) return;
          paintDetails(info);
          setTimeout(afterDetails);
        } catch (error) {
          if (request !== detailsRequest) return;
          $('details').innerHTML = `<p class="hint">${esc(error.message)}</p>`;
        }
      }

      /**
       * What waits for the details to paint: the introduction and the next
       * track's details. Its own turn, so neither is asked for before the
       * facts are on screen, and not tied to the next update from the host,
       * which may be minutes away now that it only comes on a change.
       */
      function afterDetails() {
        loadIntro();
        prefetchNextDetails();
      }

      /** Paint the shown track's details again: a language switch, an introduction, the switch. */
      function repaintDetails(options) {
        const info = detailsCache.get(detailsTrackId);
        if (info) paintDetails(info, options);
      }

      /**
       * Ask for the shown track's introduction, once its details are painted.
       *
       * Lazy on purpose: a model call takes seconds, so it waits until the
       * details have painted — playback and the NetEase facts never wait on
       * it — and it is asked only for the track the visible pane shows.
       */
      async function loadIntro() {
        if (infoView !== 'details' || !detailsTrackId || !detailsCache.has(detailsTrackId)) return;
        const id = detailsTrackId;
        const key = `${id}:${LANG}`;
        if (intros.has(key)) return;
        intros.set(key, 'pending');
        if (intros.size > 60) intros.delete(intros.keys().next().value);
        let text = '';
        try {
          const answer = await api(`/intro/${id}?lang=${LANG}`);
          text = typeof answer?.text === 'string' ? answer.text : '';
        } catch { /* NetEase's prose stands in */ }
        intros.set(key, { text });
        introsUnavailable = !text;
        if (infoView === 'details' && detailsTrackId === id) repaintDetails({ keepScroll: true });
      }

      /** NetEase dates are midnight in China; read them there, as YYYY-MM-DD. */
      function chinaDate(ms) {
        try {
          return new Date(ms).toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' });
        } catch {
          return new Date(ms).toISOString().slice(0, 10);
        }
      }

      function paintDetails(info, { keepScroll = false } = {}) {
        const facts = [];
        const fact = (label, html) => facts.push(`<dt>${esc(t(label))}</dt><dd>${html}</dd>`);
        const chips = (list, kind = '') =>
          `<span class="chips">${list.map((item) => `<span class="chip ${kind}">${esc(item)}</span>`).join('')}</span>`;

        const album = info.album ?? {};
        if (album.name) {
          const notes = [
            album.subType || album.type,
            album.publishTime ? chinaDate(album.publishTime) : '',
            album.company,
            album.size > 1 ? t('albumTracks', { n: album.size }) : '',
          ].filter(Boolean);
          fact('album', esc(album.name) + (notes.length ? ` <span class="muted">· ${esc(notes.join(' · '))}</span>` : ''));
        }
        // A genre is a path such as 流行-华语流行; its leaf names it.
        if (info.genres?.length) fact('genre', chips(info.genres.map((genre) => genre.split('-').pop()), 'genre'));
        if (info.tags?.length) fact('tags', chips(info.tags));
        const spoken = [info.language, info.bpm ? `${info.bpm} BPM` : ''].filter(Boolean);
        if (spoken.length) fact('language', esc(spoken.join(' · ')));
        if (info.featuredIn?.length) fact('featuredIn', esc(info.featuredIn.join('；')));
        if (info.awards?.length) fact('awards', esc(info.awards.join('；')));

        const netease = [];
        // NetEase separates paragraphs with a line break, often indented with
        // full-width spaces; each becomes its own paragraph, spaced apart.
        const paragraphs = (text) =>
          String(text)
            .split(/\n+/)
            .map((line) => line.trim())
            .filter(Boolean)
            .map((line) => `<p>${esc(line)}</p>`)
            .join('');
        const section = (title, text, by = '') =>
          netease.push(
            `<section class="about"><h4>${esc(title)}</h4><div class="prose" title="${esc(t('expand'))}">${paragraphs(text)}</div>` +
              (by ? `<div class="by">${esc(by)}</div>` : '') +
              '</section>',
          );
        if (info.review?.text) section(t('aboutSong'), info.review.text, info.review.by ? t('reviewBy', { name: info.review.by }) : '');
        for (const artist of info.artists ?? []) if (artist.intro) section(artist.name, artist.intro);
        if (album.intro) section(t('aboutAlbum'), album.intro);

        // The model's introduction leads; NetEase's prose is a click away. While
        // it is written, NetEase's prose shows if the model was last unavailable.
        const intro = intros.get(`${info.id}:${LANG}`);
        const written = typeof intro === 'object' && intro.text ? intro.text : '';
        const waiting = intro === undefined || intro === 'pending';
        const head = `<h4>${esc(t('intro'))}<span class="badge">AI</span></h4>`;
        const swap = (to, label) => `<button class="link source" type="button" data-source="${to}">${esc(t(label))}</button>`;
        let about;
        if (introSource === 'ai' && written) {
          about =
            `<section class="about">${head}<div class="written" title="${esc(t('introToNetease'))}">${paragraphs(written)}</div></section>` +
            (netease.length ? swap('netease', 'introFromNetease') : '');
        } else if (introSource === 'ai' && waiting && !introsUnavailable) {
          about =
            `<section class="about">${head}<p class="writing">${esc(t('introWriting'))}</p></section>` +
            (netease.length ? swap('netease', 'introFromNetease') : '');
        } else {
          about = (written ? swap('ai', 'introFromAi') : '') + netease.join('');
        }

        const alias = info.alias?.length ? `<p class="alias">${esc(info.alias.join(' / '))}</p>` : '';
        const scrolled = $('details').scrollTop;
        $('details').innerHTML =
          facts.length || about || alias
            ? alias + (facts.length ? `<dl class="facts">${facts.join('')}</dl>` : '') + about
            : `<p class="hint">${esc(t('noDetails'))}</p>`;
        $('details').scrollTop = keepScroll ? scrolled : 0;
      }

      async function loadLyrics(id) {
        const request = ++lyricRequest;
        lyric = null;
        lyricLine = -1;
        $('lyrics').innerHTML = `<p class="hint">${esc(t('loading'))}</p>`;
        try {
          const data = await api('/lyric/' + id);
          // Skipping tracks faster than NetEase answers would otherwise let an
          // earlier reply land on the newer track's pane.
          if (request !== lyricRequest) return;
          if (data.noLyric || !data.lrc) {
            $('lyrics').innerHTML = `<p class="hint">${esc(t('instrumental'))}</p>`;
            return;
          }
          const lines = [];
          for (const raw of data.lrc.split('\n')) {
            const matches = [...raw.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];
            const text = raw.replace(/\[[^\]]*\]/g, '').trim();
            if (matches.length === 0) continue;
            for (const match of matches) {
              const seconds = Number(match[1]) * 60 + Number(String(match[2]).replace(':', '.'));
              lines.push({ at: seconds * 1000, text });
            }
          }
          lines.sort((a, b) => a.at - b.at);
          lyric = lines;
          $('lyrics').innerHTML = lines.map((line, index) => `<p data-line="${index}">${esc(line.text || '♪')}</p>`).join('');
        } catch (error) {
          if (request !== lyricRequest) return;
          $('lyrics').innerHTML = `<p class="hint">${esc(error.message)}</p>`;
        }
      }

      function paintLyrics() {
        if (!lyric || infoView !== 'lyrics') return;
        const at = positionMs();
        let active = -1;
        for (let index = 0; index < lyric.length; index++) {
          if (lyric[index].at <= at) active = index; else break;
        }
        // `timeupdate` fires ~4x/s; only touch the DOM and scroll when the
        // highlighted line actually changes, or smooth scrolling thrashes.
        if (active === lyricLine) return;
        lyricLine = active;
        for (const el of $('lyrics').querySelectorAll('p')) el.classList.toggle('on', Number(el.dataset.line) === active);
        const current = $('lyrics').querySelector('p.on');
        if (current) current.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }

      // -------------------------------------------------------------- QR login
      function drawQr(text) {
        const canvas = $('qr');
        const context = canvas.getContext('2d');
        context.fillStyle = '#fff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        if (typeof qrcode !== 'function') {
          context.fillStyle = '#000';
          context.font = '12px sans-serif';
          context.fillText('QR library unavailable', 12, 24);
          return;
        }
        const qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        const count = qr.getModuleCount();
        const quiet = 2;
        const size = Math.floor(canvas.width / (count + quiet * 2));
        const offset = Math.floor((canvas.width - size * count) / 2);
        context.fillStyle = '#000';
        for (let row = 0; row < count; row++) {
          for (let col = 0; col < count; col++) {
            if (qr.isDark(row, col)) context.fillRect(offset + col * size, offset + row * size, size, size);
          }
        }
      }

      /**
       * The QR state line. The host's `state` field is stable vocabulary, so
       * it localizes here; free-form host messages (agent-facing, bilingual)
       * are the fallback for anything unknown, and a poll failure carries the
       * raw error in `error`.
       */
      function loginMessage(data) {
        if (data.error) return t('pollFailed') + data.error;
        const key = {
          waiting: 'loginWaiting',
          scanned: 'loginScanned',
          expired: 'loginExpired',
          success: 'loginSuccess',
          idle: 'loginIdle',
        }[data.state];
        return key ? t(key) : data.message || data.state;
      }

      let qrTimer;
      async function openLogin() {
        const dialog = $('login');
        dialog.showModal();
        $('qr-state').textContent = t('qrFetching');
        try {
          const data = await api('/login/qr', { method: 'POST', body: {} });
          drawQr(data.loginUrl);
          $('qr-state').textContent = t('qrScan');
        } catch (error) {
          $('qr-state').textContent = error.message;
        }
        clearInterval(qrTimer);
        qrTimer = setInterval(pollLogin, 2000);
      }

      async function pollLogin() {
        try {
          const data = await api('/login/poll', { method: 'POST', body: {} });
          if (data.state === 'success') {
            clearInterval(qrTimer);
            $('login').close();
            toast(t('loginSuccess'));
            await refresh();
            return;
          }
          if (data.loginUrl) drawQr(data.loginUrl);
          $('qr-state').textContent = loginMessage(data);
        } catch (error) {
          $('qr-state').textContent = error.message;
        }
      }

      $('qr-refresh').onclick = openLogin;
      $('qr-close').onclick = () => { clearInterval(qrTimer); $('login').close(); };
      $('login').addEventListener('close', () => clearInterval(qrTimer));

      // ---------------------------------------------------------- DJ model
      /**
       * The DJ model picker.
       *
       * Routes and their catalogued models come from the host's LLM service.
       * The catalogue is advisory — core resolution accepts unlisted ids — so
       * the "Other…" entry reveals a text field for any id the route serves. A
       * saved choice persists in the session document and takes precedence over
       * the profile patch, which the "Revert" button falls back to.
       */
      let modelRoutes = [];
      let modelSelected = { provider: null, model: null };
      let modelConfigured = { provider: null, model: null };
      /** Raw source key from the host; localized on every paint. */
      let modelSourceRaw = '';
      const CUSTOM = '__custom__';
      const MODEL_CONTROLS = [
        'dj-provider',
        'dj-model-select',
        'dj-model-custom',
        'dj-model-save',
        'dj-model-test',
        'dj-model-clear',
      ];

      /** Enable or disable every picker control at once. */
      function setModelControls(enabled) {
        for (const id of MODEL_CONTROLS) {
          const node = $(id);
          if (node) node.disabled = !enabled;
        }
      }

      /** Unfolded preference, remembered across reloads when storage is open. */
      function readDjModelPref() {
        try { return localStorage.getItem(DJ_MODEL_PREF) === '1'; } catch { return false; }
      }

      function saveDjModelPref(expanded) {
        try { localStorage.setItem(DJ_MODEL_PREF, expanded ? '1' : '0'); } catch { /* storage denied */ }
      }

      /** Reflect `djModelExpanded` in the card and in its chevron. */
      function paintDjModelToggle() {
        $('dj-model-body').classList.toggle('collapsed', !djModelExpanded);
        const button = $('dj-model-toggle');
        button.textContent = djModelExpanded ? '▾' : '▸';
        button.title = t(djModelExpanded ? 'djModelToggleHide' : 'djModelToggleShow');
        button.setAttribute('aria-expanded', djModelExpanded ? 'true' : 'false');
      }

      /**
       * The folded card's one line: the effective route and, after it, where
       * that choice came from. The route leads because it is the answer to the
       * question the folded card raises — "which model is the DJ using?".
       */
      function paintDjModelHeader() {
        const { provider, model } = modelSelected ?? {};
        $('dj-model-route').textContent = provider ? (model ? `${provider}/${model}` : provider) : '';
        paintModelSource();
      }

      /**
       * The form's status line, mirrored as a marker on the header.
       *
       * A route error or a host that predates this feature would otherwise be
       * invisible while the form is folded, which is exactly when the picker
       * looks like it is simply missing.
       */
      function paintModelStatus(text) {
        const message = text ?? '';
        $('dj-model-status').textContent = message;
        const warn = $('dj-model-warn');
        warn.textContent = message ? ' ⚠' : '';
        warn.title = message;
      }

      // The header is the click target and the chevron sits inside it, so a
      // click on the button bubbles here once rather than toggling twice.
      $('dj-model-head').onclick = () => {
        djModelExpanded = !djModelExpanded;
        saveDjModelPref(djModelExpanded);
        paintDjModelToggle();
      };
      paintDjModelToggle();

      function renderModelOptions() {
        const provider = $('dj-provider').value;
        const route = modelRoutes.find((entry) => entry.provider === provider);
        const models = route?.models ?? [];
        const select = $('dj-model-select');
        select.innerHTML =
          models.map((model) => `<option value="${esc(model.id)}">${esc(model.name || model.id)}</option>`).join('') +
          `<option value="${CUSTOM}">${esc(t('other'))}</option>`;

        const pinned = modelSelected.provider === provider ? modelSelected.model : null;
        const custom = $('dj-model-custom');
        if (pinned && models.some((model) => model.id === pinned)) {
          select.value = pinned;
          custom.style.display = 'none';
        } else if (pinned) {
          // Pinned to an id outside the catalogue; keep it rather than lose it.
          select.value = CUSTOM;
          custom.style.display = '';
          custom.value = pinned;
        } else {
          custom.style.display = 'none';
        }
        if (route?.error) paintModelStatus(route.error);
      }

      /**
       * Where the effective model choice comes from, localized.
       *
       * It trails the route on the folded card, so the separator belongs to it:
       * with no route to trail, a leading "·" would dangle.
       */
      function paintModelSource() {
        const key = {
          panel: 'srcPanel',
          config: 'srcConfig',
          'agent-default': 'srcAgentDefault',
          discovered: 'srcDiscovered',
        }[modelSourceRaw];
        const label = key ? t(key) : modelSourceRaw || '';
        const route = $('dj-model-route').textContent;
        $('dj-model-source').textContent = label && route ? ` · ${label}` : label;
      }

      async function loadModelPicker() {
        try {
          const data = await api('/dj/models');
          setModelControls(true);
          modelRoutes = data.routes ?? [];
          modelSelected = data.selected ?? { provider: null, model: null };
          modelConfigured = data.configured ?? { provider: null, model: null };

          const providers = modelRoutes.map((route) => route.provider);
          // Keep a value the catalogue does not list, so a working pin is not
          // silently replaced by whatever the adapter happens to offer.
          for (const value of [modelSelected.provider, modelConfigured.provider]) {
            if (value && !providers.includes(value)) providers.push(value);
          }
          const select = $('dj-provider');
          select.innerHTML = providers.length
            ? providers.map((provider) => `<option value="${esc(provider)}">${esc(provider)}</option>`).join('')
            : `<option value="">${esc(t('noProvider'))}</option>`;
          select.value = modelSelected.provider ?? modelConfigured.provider ?? providers[0] ?? '';

          // Painted before the options are rendered: that call is what reports a
          // provider's own catalogue failure, and it must land last so the
          // folded card's marker cannot be wiped by the (usually empty)
          // host-level error.
          modelSourceRaw = data.source ?? '';
          paintDjModelHeader();
          paintModelStatus(data.error ?? '');
          renderModelOptions();
        } catch (error) {
          // A 404 here means this page is newer than the host module: the page
          // is re-read from disk on every plugin mount, while Node keeps
          // serving the cached module. Only a process restart reunites them, so
          // say that instead of showing a bare "unknown endpoint".
          if (/unknown endpoint|\b404\b/.test(error.message)) {
            setModelControls(false);
            paintModelStatus(t('hostPredatesLong'));
          } else {
            paintModelStatus(error.message);
          }
        }
      }

      /** The model the form currently points at. */
      function chosenModel() {
        return $('dj-model-select').value === CUSTOM
          ? $('dj-model-custom').value.trim()
          : $('dj-model-select').value;
      }

      async function saveModelRoute(provider, model, message) {
        try {
          state = newest(await api('/dj', { method: 'POST', body: { provider, model } }));
          render();
          await loadModelPicker();
          toast(message);
        } catch (error) {
          toast(error.message);
        }
      }

      $('dj-provider').onchange = renderModelOptions;
      $('dj-model-select').onchange = () => {
        $('dj-model-custom').style.display = $('dj-model-select').value === CUSTOM ? '' : 'none';
      };
      $('dj-model-save').onclick = () => {
        const provider = $('dj-provider').value;
        const model = chosenModel();
        if (!provider || !model) {
          toast(t('pickProviderModel'));
          return;
        }
        void saveModelRoute(provider, model, t('saved', { route: `${provider}/${model}` }));
      };
      $('dj-model-clear').onclick = () =>
        void saveModelRoute('', '', t('reverted'));
      $('dj-model-test').onclick = async () => {
        paintModelStatus(t('testing'));
        try {
          const result = await api('/dj/test', { method: 'POST', body: {} });
          if (result.source === 'model') {
            paintModelStatus(
              `✓ ${result.route} — ${(result.picked ?? []).join(' · ')}${result.vibe ? ` (${result.vibe})` : ''}`);
          } else {
            paintModelStatus(`✗ ${result.modelError ?? result.note ?? t('modelTierUnavailable')} — ${t('heuristics')}`);
          }
        } catch (error) {
          paintModelStatus(error.message);
        }
      };

      // ------------------------------------------------------ streaming quality
      /**
       * The quality picker.
       *
       * NetEase refuses a level per track and per entitlement, and the host
       * walks down a ladder when it does, so the caption reports what was
       * *actually* served — including when that is lower than what was asked
       * for. A richer level means a much larger file: Hi-Res ran 51–63 MB per
       * track against 320 kbps MP3 at ~10 MB.
       */
      let qualityLevels = [];

      /**
       * One level's display name. The dictionary knows the shipped levels;
       * anything else falls back to the host's own (bilingual) label.
       */
      function qualityLabel(entry) {
        return DICT[LANG]?.['quality.' + entry.id] ?? DICT.en['quality.' + entry.id] ?? entry.label ?? entry.id;
      }

      /** Rebuild the picker options, preserving the current selection. */
      function paintQualityOptions() {
        if (qualityLevels.length === 0) return;
        const current = $('quality').value;
        $('quality').innerHTML = qualityLevels
          .map((entry) => `<option value="${esc(entry.id)}">${esc(qualityLabel(entry))}</option>`)
          .join('');
        if (qualityLevels.some((entry) => entry.id === current)) $('quality').value = current;
      }

      /** Caption for what the last stream actually served. */
      function paintQualityInfo() {
        const last = state?.audio?.last;
        const preferred = state?.audio?.preferred;
        if (!last || (preferred && last.requested !== preferred && last.trackId !== state?.current?.id)) {
          setText($('quality-info'), '');
          return;
        }
        const kbps = last.br ? ` · ${Math.round(last.br / 1000)} kbps` : '';
        setText($('quality-info'),
          `▶ ${String(last.type ?? '').toUpperCase()}${kbps}` + (last.downgraded ? ` (${last.served}, ${t('downgraded')})` : ''));
      }

      async function loadQuality() {
        try {
          const data = await api('/quality');
          qualityLevels = data.levels ?? [];
          paintQualityOptions();
          $('quality').value = data.preferred ?? 'exhigh';
          paintQualityInfo();
        } catch (error) {
          // A host without this endpoint is older than this page; say so once.
          $('quality-info').textContent = /unknown endpoint|\b404\b/.test(error.message)
            ? t('hostPredatesShort')
            : error.message;
        }
      }

      $('quality').onchange = async (event) => {
        try {
          state = newest(await api('/quality', { method: 'POST', body: { level: event.target.value } }));
          render();
          applyTransport();
          pokeEngine();
          paintQualityInfo();
          toast(t('qualitySet', { level: event.target.value }));
        } catch (error) {
          toast(error.message);
        }
      };

      // ------------------------------------------------------------------ wiring
      $('play').onclick = () => control({ action: 'toggle' });
      document.addEventListener('keydown', (event) => {
        if (event.key !== ' ' || event.defaultPrevented || event.isComposing ||
            event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        const focused = document.activeElement;
        if (focused?.isContentEditable || focused?.matches?.('input, textarea, select, button, [role="textbox"]')) return;
        event.preventDefault();
        if (!event.repeat) void control({ action: 'toggle' });
      });
      $('next').onclick = () => control({ action: 'next' });
      $('prev').onclick = () => control({ action: 'previous' });
      $('mode').onclick = () => control({ action: 'mode', value: { list: 'shuffle', shuffle: 'single', single: 'list' }[state?.mode || 'list'] });
      $('mute').onclick = () => control({ action: 'mute', value: !state?.muted });
      $('volume').oninput = (event) => {
        const value = Number(event.target.value);
        // The engine owns the real gain; mirror it locally and throttle the
        // round-trip while the pointer is still down.
        if (state) state.volume = value;
        setIcon($('mute'), value === 0 ? 'muted' : 'volume');
        if (Date.now() - volumePostAt > 150) {
          volumePostAt = Date.now();
          control({ action: 'volume', value });
        }
      };
      $('volume').onchange = (event) => control({ action: 'volume', value: Number(event.target.value) });
      // Sent at once: the transport silences on the first seek and debounces
      // the resume, so delaying here would only let the old position play on.
      $('seek').onchange = (event) => {
        control({ action: 'seek', value: Math.round((Number(event.target.value) / 1000) * durationMs()) });
      };
      // Both taste buttons are switchers: the filled state is the one that
      // removes, so the click asks the host for the level it moves to.
      $('like').onclick = async (event) => {
        const track = state?.current;
        if (!track) return;
        if (await sendTaste(track, track.liked ? 'none' : 'liked', event?.currentTarget)) {
          toast(t(track.liked ? 'unliked' : 'liked'));
        }
      };
      $('dislike').onclick = async (event) => {
        const track = state?.current;
        if (!track) return;
        if (track.disliked) {
          await sendTaste(track, 'none', event?.currentTarget);
          return;
        }
        // The host takes a disliked track out of the queue, and moves on when it
        // was playing; pressing next here as well would skip a second track.
        if (await sendTaste(track, 'disliked', event?.currentTarget)) toast(t('disliked'));
      };

      // Both boost buttons are switchers too: the filled one clears its boost.
      for (const direction of ['more', 'less']) {
        $(`boost-${direction}`).onclick = (event) => {
          const track = state?.current;
          if (!track) return;
          return sendBoost(track.id, track.boost === direction ? 'none' : direction, event?.currentTarget);
        };
      }
      $('boosts').onclick = (event) => {
        const target = event.target?.closest?.('[data-unboost]');
        if (target) return sendBoost(Number(target.dataset.unboost), 'none', target);
      };

      $('scrobble-toggle').onclick = async (event) => {
        const next = !state?.scrobble?.enabled;
        const button = event?.currentTarget;
        if (button) button.disabled = true;
        try {
          state = newest(await api('/scrobble', { method: 'POST', body: { enabled: next } }));
          render();
          toast(t(next ? 'scrobbleOn' : 'scrobbleOff'));
        } catch (error) {
          toast(failureText(error));
        } finally {
          if (button) button.disabled = false;
        }
      };

      $('dj-toggle').onclick = async () => {
        try {
          const data = await api('/dj', { method: 'POST', body: { enabled: !state?.dj?.enabled, prompt: $('dj-prompt').value } });
          state = newest(data);
          render();
          toast(state.dj?.enabled ? t('djOn') : t('djOff'));
        } catch (error) { toast(error.message); }
      };
      $('dj-prompt').onchange = () => api('/dj', { method: 'POST', body: { prompt: $('dj-prompt').value, enabled: state?.dj?.enabled } }).then((data) => { state = newest(data); render(); }).catch((error) => toast(error.message));

      // Not row-by-row removal, which reads each row as a dislike.
      $('queue-clear').onclick = async () => {
        try {
          state = newest(await api('/queue', { method: 'POST', body: { action: 'clear', keepCurrent: true } }));
          render();
          pokeEngine();
        } catch (error) { toast(failureText(error)); }
      };

      $('queue').onclick = async (event) => {
        const like = event.target.closest('[data-like]');
        const jump = event.target.closest('[data-jump]')?.dataset.jump;
        const remove = event.target.closest('[data-remove]');
        try {
          // A heart inside a row must not also count as "play this row".
          if (like) {
            const track = state?.queue?.[Number(like.dataset.like)];
            if (!track) return;
            await sendTaste(track, track.liked ? 'none' : 'liked', like);
            return;
          }
          if (remove) {
            // The host drops the row and, for an unrated track, records the
            // removal as the same dislike the transport ✕ makes — one request.
            // The confirm names the click, not that side effect of it.
            if (await removeFromList(Number(remove.dataset.remove), remove)) toast(t('removed'));
          } else if (jump !== undefined) {
            state = newest(await api('/queue', { method: 'POST', body: { action: 'jump', index: Number(jump) } }));
          } else return;
          render();
          pokeEngine();
        } catch (error) { toast(failureText(error)); }
      };

      // ------------------------------------------------------------------ boot
      /**
       * The host pushes its state over `/events` whenever something here would
       * change. `/state` is re-read every `POLL_MS` only while that stream is
       * down — a browser without EventSource, a host that predates the route,
       * a reconnect under way — and every `STREAM_POLL_MS` while it is up, as
       * a safety net that also ages the boosts' minutes left.
       */
      const POLL_MS = 1500;
      const STREAM_POLL_MS = 30_000;
      /** A stream the browser gave up on (an error answer) is opened again after this. */
      const RELISTEN_MS = 10_000;
      let events = null;
      let receivedAt = 0;

      function adopt(next) {
        receivedAt = Date.now();
        if (newest(next) !== next) return;
        state = next;
        render();
        applyTransport();
      }

      async function refresh() {
        try {
          adopt(await api('/state'));
        } catch (error) {
          setText($('np-title'), t('connectFailed') + error.message);
        }
      }

      function listen() {
        const Source = window.EventSource;
        if (typeof Source !== 'function') return;
        events = new Source(API + '/events');
        events.onopen = () => {
          streaming = true;
          // The host may have restarted, and its versions with it.
          versionFloor = 0;
        };
        events.onerror = () => {
          streaming = false;
          // A dropped connection is retried by the browser; an error status
          // closes the stream for good, so it is opened again from here.
          if (events.readyState === Source.CLOSED) {
            events = null;
            setTimeout(listen, RELISTEN_MS);
          }
        };
        events.addEventListener('state', (event) => {
          try { adopt(JSON.parse(event.data)); } catch { /* the next frame or poll repairs it */ }
        });
      }

      paintStaticIcons();
      applyLocale();
      watchShellLocale();
      syncShellTheme();
      refresh();
      listen();
      setInterval(() => {
        if (!streaming || Date.now() - receivedAt >= STREAM_POLL_MS) refresh();
        // A refused play changes nothing on the host, so no update would come
        // to retry it: a page that owns its audio retries on this clock.
        else applyTransport();
      }, POLL_MS);
      void loadModelPicker();
      void loadQuality();
      // Progress and lyric highlighting follow the audio element, which lives
      // in the shell document and reports nothing here, so they need their own
      // repaint clock.
      setInterval(() => { paintProgress(); paintLyrics(); }, 250);
      window.addEventListener('beforeunload', () => {
        clearInterval(qrTimer);
        events?.close();
      });
    </script>
  </body>
</html>
