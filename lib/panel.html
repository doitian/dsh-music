<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The page/engine boundary this document implements. The engine reads it
      here rather than trusting the host's own version, because *this document*
      is what decides whether to defer audio ownership — and unlike the running
      host module, it is re-read from disk on every plugin mount. Keep it in
      step with PANEL_CONTRACT in lib/client.js and lib/router.js.
    -->
    <meta name="dsh-music-panel-contract" content="2" />
    <title>Music · music.163.com</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--dsh-background, #ffffff);
        --fg: var(--dsh-foreground, #1b1c1e);
        --muted: color-mix(in srgb, var(--fg) 55%, transparent);
        --line: color-mix(in srgb, var(--fg) 14%, transparent);
        --panel: color-mix(in srgb, var(--fg) 4%, transparent);
        --accent: #e8503a;
        --radius: 10px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        background: var(--bg); color: var(--fg); overflow: hidden;
      }
      button, input, select { font: inherit; color: inherit; }
      button {
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        padding: 5px 10px; cursor: pointer; white-space: nowrap;
      }
      button:hover:not(:disabled) { border-color: color-mix(in srgb, var(--fg) 30%, transparent); }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      input, select {
        background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
      }
      input:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); }

      #app { display: flex; flex-direction: column; height: 100%; }

      header {
        display: flex; align-items: center; gap: 8px; padding: 10px 14px;
        border-bottom: 1px solid var(--line); flex-wrap: wrap;
      }
      .brand { font-weight: 650; letter-spacing: 0.2px; }
      .brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
      .spacer { flex: 1; }
      #dj-prompt { min-width: 200px; flex: 0 1 260px; }
      #dj-toggle.on { background: var(--accent); border-color: var(--accent); color: #fff; }
      #account { display: flex; align-items: center; gap: 7px; color: var(--muted); }
      #account img { width: 22px; height: 22px; border-radius: 50%; }

      main { display: flex; flex: 1; min-height: 0; }
      .player { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

      .scroll { overflow: auto; padding: 0 8px 16px; flex: 1; }
      .scroll::-webkit-scrollbar { width: 9px; }
      .scroll::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--fg) 18%, transparent); border-radius: 9px; }

      .row {
        display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer;
      }
      .row:hover { background: var(--panel); }
      .row.playing { background: color-mix(in srgb, var(--accent) 12%, transparent); }
      .row .idx { width: 22px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
      .row img { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; flex: none; background: var(--panel); }
      .row .meta { min-width: 0; flex: 1; }
      .row .name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row .sub { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row .tag { font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; color: var(--muted); flex: none; }
      .row .dur { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; font-size: 12px; }
      .row .acts { display: none; gap: 4px; flex: none; }
      .row:hover .acts { display: flex; }

      .now { padding: 14px; border-bottom: 1px solid var(--line); }
      .now-top { display: flex; gap: 14px; }
      .now-top img { width: 104px; height: 104px; border-radius: 10px; object-fit: cover; background: var(--panel); flex: none; }
      .now-title { font-size: 16px; font-weight: 650; line-height: 1.3; }
      .now-artists { color: var(--muted); margin-top: 3px; }
      .now-album { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .bar { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
      input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; padding: 0; height: 16px; flex: 1; min-width: 0; }
      input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--fg) 18%, transparent); }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: var(--accent); }
      .controls { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
      .controls .grow { flex: 1; }
      .icon { font-size: 15px; line-height: 1; }
      #volume { flex: 0 0 88px; }
      .mode { font-size: 12px; }

      .section-title { padding: 12px 14px 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; }
      .lyrics { max-height: 34%; overflow: auto; padding: 0 14px 12px; }
      .lyrics p { margin: 0; padding: 2px 0; color: var(--muted); transition: color 0.15s; }
      .lyrics p.on { color: var(--fg); font-weight: 600; }
      .queue { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .queue .scroll { padding-top: 0; }
      .dj-status { margin: 0 14px 12px; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); font-size: 12px; }
      .dj-status b { color: var(--accent); }
      .model-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .row-inline { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
      .row-inline select, .row-inline input { flex: 1 1 0; min-width: 0; font-size: 12px; padding: 4px 6px; }
      .row-inline button { font-size: 12px; padding: 4px 8px; }
      .empty { padding: 24px 14px; color: var(--muted); text-align: center; }
      .toast {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        background: #1b1c1e; color: #fff; padding: 8px 14px; border-radius: 9px; font-size: 12px;
        opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 40; max-width: 80%;
      }
      .toast.on { opacity: 0.94; }
      dialog {
        border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--fg);
        padding: 18px; width: min(340px, 88vw);
      }
      dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
      #qr { display: block; margin: 12px auto; width: 220px; height: 220px; image-rendering: pixelated; border-radius: 8px; background: #fff; padding: 8px; }
      .hint { color: var(--muted); font-size: 12px; text-align: center; }
      .row-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 14px; }
      .need-gesture { background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: var(--radius); padding: 8px 11px; margin: 0 14px 12px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">音乐<small>music.163.com</small></div>
        <div class="spacer"></div>
        <input id="dj-prompt" placeholder="AI DJ 心情 / mood, e.g. rainy afternoon jazz" />
        <button id="dj-toggle" title="Continuous AI DJ: keep the queue stocked">AI DJ</button>
        <div id="account"></div>
      </header>

      <main>
        <section class="player">
          <div class="now">
            <div class="now-top">
              <img id="cover" alt="" />
              <div style="min-width: 0; flex: 1">
                <div class="now-title" id="np-title">未播放 / nothing playing</div>
                <div class="now-artists" id="np-artists"></div>
                <div class="now-album" id="np-album"></div>
              </div>
            </div>
            <div class="bar">
              <span id="t-cur">0:00</span>
              <input type="range" id="seek" min="0" max="1000" value="0" step="1" />
              <span id="t-dur">0:00</span>
            </div>
            <div class="controls">
              <button id="prev" title="上一首 previous">⏮</button>
              <button id="play" class="primary" title="播放/暂停 play/pause">▶</button>
              <button id="next" title="下一首 next">⏭</button>
              <button id="mode" class="mode" title="播放模式 mode">列表</button>
              <select id="quality" class="mode" title="流媒体音质 / streaming quality"></select>
              <span id="quality-info" class="mode" style="color: var(--muted)"></span>
              <span class="grow"></span>
              <button id="like" title="喜欢 like">♡</button>
              <button id="dislike" title="不喜欢 dislike">✕</button>
              <button id="mute" title="静音 mute">🔊</button>
              <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
            </div>
          </div>

          <div class="section-title">歌词 Lyrics</div>
          <div class="lyrics" id="lyrics"><p class="hint">—</p></div>

          <div class="section-title">播放队列 Queue <span id="counts"></span></div>
          <div class="queue"><div class="scroll" id="queue"></div></div>
          <div id="dj-status"></div>

          <div class="dj-status" id="dj-model">
            <div class="model-head">
              <span>AI DJ 模型 / DJ model</span>
              <span id="dj-model-source" style="color: var(--muted)"></span>
            </div>
            <div class="row-inline">
              <select id="dj-provider" title="provider route"></select>
              <select id="dj-model-select" title="model"></select>
            </div>
            <div class="row-inline">
              <input id="dj-model-custom" placeholder="自定义 model id / custom model id" style="display: none" />
            </div>
            <div class="row-inline">
              <button id="dj-model-save" class="primary">保存 Save</button>
              <button id="dj-model-test">测试 Test</button>
              <button id="dj-model-clear" title="回退到 profile 配置 / revert to the profile patch">回退 Revert</button>
            </div>
            <div id="dj-model-status" style="color: var(--muted)"></div>
          </div>
        </section>
      </main>
    </div>

    <dialog id="login">
      <div style="font-weight: 650">网易云音乐登录 / Sign in</div>
      <canvas id="qr" width="220" height="220"></canvas>
      <div class="hint" id="qr-state">正在获取二维码… / fetching QR…</div>
      <div class="row-actions">
        <button id="qr-refresh">刷新 Refresh</button>
        <button id="qr-close" class="primary">关闭 Close</button>
      </div>
    </dialog>

    <div class="toast" id="toast"></div>

    <script src="__BASE__/vendor/qrcode.js"></script>
    <script>
      // ------------------------------------------------------------------ setup
      const BASE = '__BASE__';
      const API = BASE + '/api';
      const $ = (id) => document.getElementById(id);

      /** Last state document from the host. */
      let state = null;
      let lyric = null;
      let lyricLine = -1;
      /** Track whose lyrics belong in the pane; drives the fetch, per track. */
      let lyricTrackId = null;
      /** Bumped per request so a slow reply for a skipped track is discarded. */
      let lyricRequest = 0;
      let volumePostAt = 0;

      const fmt = (ms) => {
        const total = Math.max(Math.floor((ms || 0) / 1000), 0);
        return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
      };
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      let toastTimer;
      function toast(message) {
        const el = $('toast');
        el.textContent = message;
        el.classList.add('on');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('on'), 2600);
      }

      async function api(path, options) {
        const response = await fetch(API + path, {
          headers: { 'Content-Type': 'application/json' },
          ...options,
          ...(options && options.body ? { body: JSON.stringify(options.body) } : {}),
        });
        const text = await response.text();
        let data;
        try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text.slice(0, 200) }; }
        if (!response.ok) throw new Error(data.error || data.message || 'HTTP ' + response.status);
        return data;
      }

      // ------------------------------------------------------------- transport
      /**
       * Who plays the audio.
       *
       * Normally the client plugin's engine in the shell document owns it: the
       * layout renders only the ACTIVE `main` slot entry, so this document is
       * unmounted the moment the user opens a session, and playback has to
       * outlive that. The page is then a remote control over the host's state.
       *
       * The engine is not guaranteed to exist or to be usable, though: this
       * page is re-read from disk on every plugin mount, while the browser
       * bundle it pairs with is pinned to its own revision. When they disagree
       * the engine declares itself inert. Rather than go silent, this page then
       * owns the `<audio>` element itself — the older behaviour, which still
       * plays, only without surviving a panel switch.
       */
      function shellEngine() {
        try {
          const candidate = window.parent?.__dshMusicEngine;
          // Only an engine that declares it actually plays is authoritative;
          // anything else (including an older bundle's engine) would leave the
          // audio element unowned.
          return candidate?.playback === true ? candidate : undefined;
        } catch {
          return undefined;
        }
      }

      /** @type {object | undefined} */
      let localTransport;

      /** The active transport, creating the local fallback on first use. */
      function transport() {
        const engine = shellEngine();
        if (engine) {
          if (localTransport) {
            localTransport.dispose();
            localTransport = undefined;
          }
          return engine;
        }
        if (!localTransport) {
          // Stand down any engine that cannot play, so exactly one transport
          // owns the audio element and nothing plays twice.
          try { window.parent?.__dshMusicEngine?.dispose?.(); } catch { /* ignore */ }
          localTransport = createLocalTransport();
        }
        return localTransport;
      }

      /**
       * The fallback transport: this page owns an `<audio>` element.
       *
       * It reconciles on `transportRev`, but enforces play/pause on every poll
       * — a refused `play()` does not change the revision, so gating the retry
       * would stop the music for good after the first browser refusal.
       */
      function createLocalTransport() {
        const audio = document.createElement('audio');
        audio.preload = 'auto';
        audio.style.display = 'none';
        document.body.appendChild(audio);

        let applied = -1;
        let busy = false;
        let disposed = false;

        function attemptPlay() {
          if (busy || disposed) return;
          busy = true;
          const done = () => { busy = false; };
          audio.play().then(done, done);
        }

        function reconcile(next) {
          if (!next || next.transportRev === applied) return;
          applied = next.transportRev;
          if (next.pendingSeek !== null && next.pendingSeek !== undefined) {
            try { audio.currentTime = next.pendingSeek / 1000; } catch { /* not seekable yet */ }
            api('/seek-consumed', { method: 'POST', body: {} }).catch(() => {});
          }
        }

        /**
         * Pick the resource to play. Every poll, not just on a transport change:
         * the resource identity includes the streaming quality, so a quality
         * switch has to be noticed without waiting for the revision to move.
         * The level rides in the URL because the same track at two levels is two
         * different files — range-requesting offsets across encodings would
         * corrupt the stream.
         */
        function applySource(next) {
          const track = next.current;
          if (!track) {
            if (audio.dataset.trackKey !== undefined) {
              delete audio.dataset.trackKey;
              delete audio.dataset.trackId;
              audio.pause();
              audio.removeAttribute('src');
              audio.load();
            }
            return;
          }
          const level = next.audio?.preferred ?? 'exhigh';
          const key = track.id + ':' + level;
          if (audio.dataset.trackKey === key) return;

          const sameTrack = audio.dataset.trackId === String(track.id);
          const resumeAt = sameTrack ? audio.currentTime : 0;
          audio.dataset.trackKey = key;
          audio.dataset.trackId = String(track.id);
          if (resumeAt > 0.5) {
            audio.addEventListener('loadedmetadata', () => {
              try { audio.currentTime = resumeAt; } catch { /* not seekable */ }
            }, { once: true });
          }
          audio.src = BASE + '/stream/' + track.id + '?level=' + encodeURIComponent(level);
          audio.load();
        }

        function apply(next) {
          if (disposed || !next) return;
          reconcile(next);
          applySource(next);
          audio.volume = next.muted ? 0 : next.volume;
          if (!next.current) return;
          if (next.playing && audio.paused) attemptPlay();
          else if (!next.playing && !audio.paused) audio.pause();
        }

        async function report(extra) {
          if (!state?.current) return;
          try {
            await api('/report', {
              method: 'POST',
              body: {
                trackId: state.current.id,
                position: Math.round((audio.currentTime || 0) * 1000),
                duration: Number.isFinite(audio.duration) ? Math.round(audio.duration * 1000) : undefined,
                playing: !audio.paused,
                ...extra,
              },
            });
          } catch { /* the host will be re-read on the next poll */ }
        }

        audio.addEventListener('ended', () => report({ ended: true }));
        audio.addEventListener('error', () => {
          if (audio.dataset.trackId) report({ error: 'audio element error (track unavailable or network)' });
        });
        audio.addEventListener('timeupdate', () => { paintProgress(); paintLyrics(); });

        return {
          playback: true,
          local: true,
          apply,
          sync() { apply(state); },
          playNow() { attemptPlay(); },
          /** Exact position: this transport owns the element. */
          position: () => (audio.currentTime || 0) * 1000,
          dispose() {
            disposed = true;
            try {
              audio.pause();
              audio.removeAttribute('src');
              audio.remove();
            } catch { /* the document may already be gone */ }
          },
        };
      }

      /** Push the latest host state into whichever transport is active. */
      function applyTransport() {
        const active = transport();
        try {
          active.apply?.(state);
        } catch { /* a failing transport must not break rendering */ }
      }

      /** Ask the active transport to act now instead of on its next poll. */
      function pokeEngine() {
        try { transport().sync?.(); } catch { /* best effort across documents */ }
      }

      async function control(body) {
        try {
          state = await api('/control', { method: 'POST', body });
          render();
          applyTransport();
        } catch (error) { toast(error.message); }
        pokeEngine();
      }

      /**
       * Playback position.
       *
       * A local element knows exactly; the shell engine reports about once a
       * second, which is too coarse for a smooth bar, so the time since its
       * report is added back.
       */
      function positionMs() {
        const active = transport();
        if (typeof active.position === 'function') return active.position();
        const reported = state?.reported ?? {};
        const base = Number(reported.position) || 0;
        if (!state?.playing || !reported.playing) return base;
        const at = Number(reported.at) || 0;
        return at ? base + Math.max(Date.now() - at, 0) : base;
      }

      /** Duration the transport knows, falling back to the track's metadata. */
      function durationMs() {
        const reported = Number(state?.reported?.duration) || 0;
        return reported > 0 ? reported : Number(state?.current?.duration) || 0;
      }

      /**
       * The host wants playback, and the transport's own report for *this*
       * track says it is not playing. In practice that means the browser
       * refused to start audio until the page has been interacted with.
       */
      function autoplayBlocked() {
        const reported = state?.reported;
        return Boolean(
          state?.playing &&
            state?.current &&
            reported?.playing === false &&
            Number(reported.at) > 0 &&
            reported.trackId === state.current.id,
        );
      }

      /**
       * Start audio from inside this click.
       *
       * The gesture grants sticky user activation to the document that owns the
       * element — this one for the local transport, the shell document for the
       * engine, as activation propagates up the same-origin frame tree.
       * `playNow()` fires the attempt synchronously; the repeats cover the
       * propagation order and any attempt already in flight.
       */
      function resumeWithGesture() {
        const attempt = () => {
          try { transport().playNow?.(); } catch { /* ignore */ }
          pokeEngine();
        };
        attempt();
        setTimeout(attempt, 200);
        setTimeout(attempt, 800);
        toast('正在恢复播放… / resuming…');
      }

      // ---------------------------------------------------------------- render
      function render() {
        if (!state) return;
        const track = state.current;
        $('cover').src = track?.picUrl || '';
        $('cover').style.visibility = track?.picUrl ? 'visible' : 'hidden';
        $('np-title').textContent = track ? track.name : '未播放 / nothing playing';
        $('np-artists').textContent = track ? (track.artists || []).join(' / ') : '';
        $('np-album').textContent = track ? track.album || '' : '';
        // Lyrics belong to the track, and this page fetches them itself on
        // every poll — not from the local transport's `applySource`, which
        // only ever runs when this page owns the audio element. In the normal
        // case the shell engine plays, so that path is dead and the pane
        // stayed empty forever.
        const trackId = track?.id ?? null;
        if (trackId !== lyricTrackId) {
          lyricTrackId = trackId;
          if (trackId) loadLyrics(trackId);
          else {
            lyric = null;
            lyricLine = -1;
            $('lyrics').innerHTML = '<p class="hint">—</p>';
          }
        }
        $('play').textContent = state.playing ? '⏸' : '▶';
        $('mode').textContent = { list: '列表', single: '单曲', shuffle: '随机' }[state.mode] || '列表';
        $('counts').textContent = state.counts ? `(${state.counts.queued})` : '';
        $('dj-toggle').classList.toggle('on', Boolean(state.dj?.enabled));
        // The mood brief is persisted player setting, not part of the DJ status
        // block, so it comes from `settings`.
        if (document.activeElement !== $('dj-prompt')) $('dj-prompt').value = state.settings?.djPrompt ?? '';

        // Account chip
        const account = state.account;
        $('account').innerHTML = account
          ? `${account.avatar ? `<img src="${esc(account.avatar)}" alt="">` : ''}<span>${esc(account.nickname)}${account.vip ? ' · VIP' : ''}</span>`
          : `<button id="signin">登录 Sign in</button>`;
        const signin = $('signin');
        if (signin) signin.onclick = openLogin;

        // DJ status
        const dj = state.dj || {};
        $('dj-status').innerHTML = dj.enabled || dj.lastPlan
          ? `<div class="dj-status">${dj.busy ? 'AI DJ 正在选曲… / planning…' : dj.error ? `AI DJ: ${esc(dj.error)}` : ''}${
              dj.lastPlan
                ? `<div><b>${esc(dj.lastPlan.source === 'model' ? 'AI DJ' : 'AI DJ (heuristic)')}</b>${dj.lastPlan.route ? ` <span style="color:var(--muted)">${esc(dj.lastPlan.route)}</span>` : ''} +${dj.lastPlan.added}: ${esc(dj.lastPlan.vibe || '')}</div><div style="color:var(--muted)">${esc((dj.lastPlan.names || []).slice(-3).join(' · '))}</div>`
                : ''
            }${dj.modelError && !dj.lastPlan?.route ? `<div style="color:var(--muted)">模型层不可用 / model tier unavailable: ${esc(dj.modelError)}</div>` : ''}${dj.enabled ? '<div style="color:var(--muted);margin-top:4px">持续补歌中 / keeping the queue stocked</div>' : ''}</div>`
          : '';

        if (autoplayBlocked()) {
          if (!$('gesture')) {
            const el = document.createElement('div');
            el.id = 'gesture';
            el.className = 'need-gesture';
            el.innerHTML = '浏览器需要你先与页面交互一次才会播放声音 / Chromium needs one interaction with this window before it will play audio — <button id="gesture-go" class="primary">点击播放 / Play</button> <span style="color:var(--muted)">在窗口任意处点击也可以 / clicking anywhere works too</span>';
            $('dj-status').before(el);
            el.querySelector('#gesture-go').onclick = resumeWithGesture;
          }
        } else {
          $('gesture')?.remove();
        }

        // The engine owns the real volume; mirror it unless the user is
        // mid-drag, when overwriting the thumb would fight the pointer.
        if (document.activeElement !== $('volume')) $('volume').value = state.volume;
        $('mute').textContent = state.muted || state.volume === 0 ? '🔇' : '🔊';

        // Same for quality: the host is authoritative, the select mirrors it.
        const preferredLevel = state.audio?.preferred;
        if (
          preferredLevel &&
          document.activeElement !== $('quality') &&
          qualityLevels.some((entry) => entry.id === preferredLevel)
        ) {
          $('quality').value = preferredLevel;
        }
        paintQualityInfo();

        renderQueue();
        paintProgress();
      }

      function renderQueue() {
        if (!state) return;
        const queue = state.queue || [];
        if (queue.length === 0) {
          $('queue').innerHTML = '<div class="empty">队列为空，用 AI DJ 或让助手补歌 / queue empty</div>';
          return;
        }
        $('queue').innerHTML = queue
          .map((track, index) => {
            const playing = index === state.index;
            return `<div class="row ${playing ? 'playing' : ''}" data-jump="${index}">
              <span class="idx">${playing ? '▶' : index + 1}</span>
              <img src="${esc(track.picUrl || '')}" alt="" loading="lazy">
              <span class="meta"><span class="name">${esc(track.name)}</span><span class="sub">${esc((track.artists || []).join(' / '))}</span></span>
              ${track.vip ? '<span class="tag">VIP</span>' : ''}
              <span class="dur">${fmt(track.duration)}</span>
              <span class="acts"><button data-remove="${index}" title="移除">✕</button></span>
            </div>`;
          })
          .join('');
      }

      function paintProgress() {
        if (!state || !state.current) return;
        const position = positionMs();
        const duration = durationMs();
        if (document.activeElement !== $('seek')) {
          $('seek').value = duration > 0 ? String(Math.round((position / duration) * 1000)) : '0';
        }
        $('t-cur').textContent = fmt(position);
        $('t-dur').textContent = fmt(duration);
      }

      // ---------------------------------------------------------------- lyrics
      async function loadLyrics(id) {
        const request = ++lyricRequest;
        lyric = null;
        lyricLine = -1;
        $('lyrics').innerHTML = '<p class="hint">加载中… / loading…</p>';
        try {
          const data = await api('/lyric/' + id);
          // Skipping tracks faster than NetEase answers would otherwise let an
          // earlier reply land on the newer track's pane.
          if (request !== lyricRequest) return;
          if (data.noLyric || !data.lrc) {
            $('lyrics').innerHTML = '<p class="hint">纯音乐，无歌词 / instrumental</p>';
            return;
          }
          const lines = [];
          for (const raw of data.lrc.split('\n')) {
            const matches = [...raw.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];
            const text = raw.replace(/\[[^\]]*\]/g, '').trim();
            if (matches.length === 0) continue;
            for (const match of matches) {
              const seconds = Number(match[1]) * 60 + Number(String(match[2]).replace(':', '.'));
              lines.push({ at: seconds * 1000, text });
            }
          }
          lines.sort((a, b) => a.at - b.at);
          lyric = lines;
          $('lyrics').innerHTML = lines.map((line, index) => `<p data-line="${index}">${esc(line.text || '♪')}</p>`).join('');
        } catch (error) {
          if (request !== lyricRequest) return;
          $('lyrics').innerHTML = `<p class="hint">${esc(error.message)}</p>`;
        }
      }

      function paintLyrics() {
        if (!lyric) return;
        const at = positionMs();
        let active = -1;
        for (let index = 0; index < lyric.length; index++) {
          if (lyric[index].at <= at) active = index; else break;
        }
        // `timeupdate` fires ~4x/s; only touch the DOM and scroll when the
        // highlighted line actually changes, or smooth scrolling thrashes.
        if (active === lyricLine) return;
        lyricLine = active;
        for (const el of $('lyrics').querySelectorAll('p')) el.classList.toggle('on', Number(el.dataset.line) === active);
        const current = $('lyrics').querySelector('p.on');
        if (current) current.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }

      // -------------------------------------------------------------- QR login
      function drawQr(text) {
        const canvas = $('qr');
        const context = canvas.getContext('2d');
        context.fillStyle = '#fff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        if (typeof qrcode !== 'function') {
          context.fillStyle = '#000';
          context.font = '12px sans-serif';
          context.fillText('QR library unavailable', 12, 24);
          return;
        }
        const qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        const count = qr.getModuleCount();
        const quiet = 2;
        const size = Math.floor(canvas.width / (count + quiet * 2));
        const offset = Math.floor((canvas.width - size * count) / 2);
        context.fillStyle = '#000';
        for (let row = 0; row < count; row++) {
          for (let col = 0; col < count; col++) {
            if (qr.isDark(row, col)) context.fillRect(offset + col * size, offset + row * size, size, size);
          }
        }
      }

      let qrTimer;
      async function openLogin() {
        const dialog = $('login');
        dialog.showModal();
        $('qr-state').textContent = '正在获取二维码… / fetching QR…';
        try {
          const data = await api('/login/qr', { method: 'POST', body: {} });
          drawQr(data.loginUrl);
          $('qr-state').textContent = '用网易云音乐 App 扫码 / scan with the NetEase app';
        } catch (error) {
          $('qr-state').textContent = error.message;
        }
        clearInterval(qrTimer);
        qrTimer = setInterval(pollLogin, 2000);
      }

      async function pollLogin() {
        try {
          const data = await api('/login/poll', { method: 'POST', body: {} });
          if (data.state === 'success') {
            clearInterval(qrTimer);
            $('login').close();
            toast('登录成功 / signed in');
            await refresh();
            return;
          }
          if (data.loginUrl) drawQr(data.loginUrl);
          $('qr-state').textContent = data.message || data.state;
        } catch (error) {
          $('qr-state').textContent = error.message;
        }
      }

      $('qr-refresh').onclick = openLogin;
      $('qr-close').onclick = () => { clearInterval(qrTimer); $('login').close(); };
      $('login').addEventListener('close', () => clearInterval(qrTimer));

      // ---------------------------------------------------------- DJ model
      /**
       * The DJ model picker.
       *
       * Routes and their catalogued models come from the host's LLM service.
       * The catalogue is advisory — core resolution accepts unlisted ids — so
       * "其他… / Other…" reveals a text field for any id the route serves. A
       * saved choice persists in the session document and takes precedence over
       * the profile patch, which "回退 Revert" falls back to.
       */
      let modelRoutes = [];
      let modelSelected = { provider: null, model: null };
      let modelConfigured = { provider: null, model: null };
      const CUSTOM = '__custom__';
      const MODEL_CONTROLS = [
        'dj-provider',
        'dj-model-select',
        'dj-model-custom',
        'dj-model-save',
        'dj-model-test',
        'dj-model-clear',
      ];

      /** Enable or disable every picker control at once. */
      function setModelControls(enabled) {
        for (const id of MODEL_CONTROLS) {
          const node = $(id);
          if (node) node.disabled = !enabled;
        }
      }

      function renderModelOptions() {
        const provider = $('dj-provider').value;
        const route = modelRoutes.find((entry) => entry.provider === provider);
        const models = route?.models ?? [];
        const select = $('dj-model-select');
        select.innerHTML =
          models.map((model) => `<option value="${esc(model.id)}">${esc(model.name || model.id)}</option>`).join('') +
          `<option value="${CUSTOM}">其他… / Other…</option>`;

        const pinned = modelSelected.provider === provider ? modelSelected.model : null;
        const custom = $('dj-model-custom');
        if (pinned && models.some((model) => model.id === pinned)) {
          select.value = pinned;
          custom.style.display = 'none';
        } else if (pinned) {
          // Pinned to an id outside the catalogue; keep it rather than lose it.
          select.value = CUSTOM;
          custom.style.display = '';
          custom.value = pinned;
        } else {
          custom.style.display = 'none';
        }
        if (route?.error) $('dj-model-status').textContent = route.error;
      }

      async function loadModelPicker() {
        try {
          const data = await api('/dj/models');
          setModelControls(true);
          modelRoutes = data.routes ?? [];
          modelSelected = data.selected ?? { provider: null, model: null };
          modelConfigured = data.configured ?? { provider: null, model: null };

          const providers = modelRoutes.map((route) => route.provider);
          // Keep a value the catalogue does not list, so a working pin is not
          // silently replaced by whatever the adapter happens to offer.
          for (const value of [modelSelected.provider, modelConfigured.provider]) {
            if (value && !providers.includes(value)) providers.push(value);
          }
          const select = $('dj-provider');
          select.innerHTML = providers.length
            ? providers.map((provider) => `<option value="${esc(provider)}">${esc(provider)}</option>`).join('')
            : '<option value="">(无 provider / none)</option>';
          select.value = modelSelected.provider ?? modelConfigured.provider ?? providers[0] ?? '';
          renderModelOptions();

          $('dj-model-source').textContent =
            {
              panel: '面板 / panel',
              config: '配置 / profile',
              'agent-default': '会话模型 / session model',
              discovered: '自动 / auto',
            }[data.source] ?? data.source ?? '';
          $('dj-model-status').textContent = data.error ?? '';
        } catch (error) {
          // A 404 here means this page is newer than the host module: the page
          // is re-read from disk on every plugin mount, while Node keeps
          // serving the cached module. Only a process restart reunites them, so
          // say that instead of showing a bare "unknown endpoint".
          if (/unknown endpoint|\b404\b/.test(error.message)) {
            setModelControls(false);
            $('dj-model-status').textContent =
              '宿主模块早于本功能：请完全退出并重新启动 Harness（关闭窗口不够，它会留在托盘里）/ ' +
              'the host module predates this feature — fully quit and relaunch the harness ' +
              '(closing the window is not enough; it stays running in the tray)';
          } else {
            $('dj-model-status').textContent = error.message;
          }
        }
      }

      /** The model the form currently points at. */
      function chosenModel() {
        return $('dj-model-select').value === CUSTOM
          ? $('dj-model-custom').value.trim()
          : $('dj-model-select').value;
      }

      async function saveModelRoute(provider, model, message) {
        try {
          state = await api('/dj', { method: 'POST', body: { provider, model } });
          render();
          await loadModelPicker();
          toast(message);
        } catch (error) {
          toast(error.message);
        }
      }

      $('dj-provider').onchange = renderModelOptions;
      $('dj-model-select').onchange = () => {
        $('dj-model-custom').style.display = $('dj-model-select').value === CUSTOM ? '' : 'none';
      };
      $('dj-model-save').onclick = () => {
        const provider = $('dj-provider').value;
        const model = chosenModel();
        if (!provider || !model) {
          toast('请先选择 provider 与 model / pick a provider and a model');
          return;
        }
        void saveModelRoute(provider, model, `已保存 / saved ${provider}/${model}`);
      };
      $('dj-model-clear').onclick = () =>
        void saveModelRoute('', '', '已回退到 profile 配置 / reverted to the profile config');
      $('dj-model-test').onclick = async () => {
        $('dj-model-status').textContent = '测试中… / testing…';
        try {
          const result = await api('/dj/test', { method: 'POST', body: {} });
          if (result.source === 'model') {
            $('dj-model-status').textContent =
              `✓ ${result.route} — ${(result.picked ?? []).join(' · ')}${result.vibe ? ` (${result.vibe})` : ''}`;
          } else {
            $('dj-model-status').textContent =
              `✗ ${result.modelError ?? result.note ?? 'model tier unavailable'} — 已用启发式 / heuristics`;
          }
        } catch (error) {
          $('dj-model-status').textContent = error.message;
        }
      };

      // ------------------------------------------------------ streaming quality
      /**
       * The quality picker.
       *
       * NetEase refuses a level per track and per entitlement, and the host
       * walks down a ladder when it does, so the caption reports what was
       * *actually* served — including when that is lower than what was asked
       * for. A richer level means a much larger file: Hi-Res ran 51–63 MB per
       * track against 320 kbps MP3 at ~10 MB.
       */
      let qualityLevels = [];

      /** Caption for what the last stream actually served. */
      function paintQualityInfo() {
        const last = state?.audio?.last;
        const preferred = state?.audio?.preferred;
        if (!last || (preferred && last.requested !== preferred && last.trackId !== state?.current?.id)) {
          $('quality-info').textContent = '';
          return;
        }
        const kbps = last.br ? ` · ${Math.round(last.br / 1000)} kbps` : '';
        $('quality-info').textContent =
          `▶ ${String(last.type ?? '').toUpperCase()}${kbps}` + (last.downgraded ? ` (${last.served}, 已降级/downgraded)` : '');
      }

      async function loadQuality() {
        try {
          const data = await api('/quality');
          qualityLevels = data.levels ?? [];
          $('quality').innerHTML = qualityLevels
            .map((entry) => `<option value="${esc(entry.id)}">${esc(entry.label || entry.id)}</option>`)
            .join('');
          $('quality').value = data.preferred ?? 'exhigh';
          paintQualityInfo();
        } catch (error) {
          // A host without this endpoint is older than this page; say so once.
          $('quality-info').textContent = /unknown endpoint|\b404\b/.test(error.message)
            ? '宿主模块早于本功能 / host module predates this feature'
            : error.message;
        }
      }

      $('quality').onchange = async (event) => {
        try {
          state = await api('/quality', { method: 'POST', body: { level: event.target.value } });
          render();
          applyTransport();
          pokeEngine();
          paintQualityInfo();
          toast('音质已设为 / quality set to ' + event.target.value);
        } catch (error) {
          toast(error.message);
        }
      };

      // ------------------------------------------------------------------ wiring
      $('play').onclick = () => control({ action: 'toggle' });
      $('next').onclick = () => control({ action: 'next' });
      $('prev').onclick = () => control({ action: 'previous' });
      $('mode').onclick = () => control({ action: 'mode', value: { list: 'shuffle', shuffle: 'single', single: 'list' }[state?.mode || 'list'] });
      $('mute').onclick = () => control({ action: 'mute', value: !state?.muted });
      $('volume').oninput = (event) => {
        const value = Number(event.target.value);
        // The engine owns the real gain; mirror it locally and throttle the
        // round-trip while the pointer is still down.
        if (state) state.volume = value;
        $('mute').textContent = value === 0 ? '🔇' : '🔊';
        if (Date.now() - volumePostAt > 150) {
          volumePostAt = Date.now();
          control({ action: 'volume', value });
        }
      };
      $('volume').onchange = (event) => control({ action: 'volume', value: Number(event.target.value) });
      $('seek').onchange = (event) => {
        control({ action: 'seek', value: Math.round((Number(event.target.value) / 1000) * durationMs()) });
      };
      $('like').onclick = () => state?.current && api('/feedback', { method: 'POST', body: { kind: 'likes', trackId: state.current.id } }).then(() => toast('已喜欢 / liked'));
      $('dislike').onclick = () => state?.current && api('/feedback', { method: 'POST', body: { kind: 'dislikes', trackId: state.current.id } }).then(() => { toast('不再推荐 / disliked'); control({ action: 'next' }); });

      $('dj-toggle').onclick = async () => {
        try {
          const data = await api('/dj', { method: 'POST', body: { enabled: !state?.dj?.enabled, prompt: $('dj-prompt').value } });
          state = data;
          render();
          toast(state.dj?.enabled ? 'AI DJ 已开启 / AI DJ on' : 'AI DJ 已关闭 / AI DJ off');
        } catch (error) { toast(error.message); }
      };
      $('dj-prompt').onchange = () => api('/dj', { method: 'POST', body: { prompt: $('dj-prompt').value, enabled: state?.dj?.enabled } }).then((data) => { state = data; render(); }).catch((error) => toast(error.message));

      $('queue').onclick = async (event) => {
        const jump = event.target.closest('[data-jump]')?.dataset.jump;
        const remove = event.target.closest('[data-remove]')?.dataset.remove;
        try {
          if (remove !== undefined) {
            state = await api('/queue', { method: 'POST', body: { action: 'remove', index: Number(remove) } });
          } else if (jump !== undefined) {
            state = await api('/queue', { method: 'POST', body: { action: 'jump', index: Number(jump) } });
          } else return;
          render();
          pokeEngine();
        } catch (error) { toast(error.message); }
      };

      // ------------------------------------------------------------------ boot
      async function refresh() {
        try {
          state = await api('/state');
          render();
          applyTransport();
        } catch (error) {
          $('np-title').textContent = '连接失败 / cannot reach the host: ' + error.message;
        }
      }

      refresh();
      setInterval(refresh, 1500);
      void loadModelPicker();
      void loadQuality();
      // Progress and lyric highlighting interpolate locally between the
      // engine's reports, so they need their own repaint clock now that the
      // audio element lives in the shell document.
      setInterval(() => { paintProgress(); paintLyrics(); }, 250);
      window.addEventListener('beforeunload', () => { clearInterval(qrTimer); });
    </script>
  </body>
</html>
